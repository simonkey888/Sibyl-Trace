name: Research Lab V4 Operational

on:
  workflow_run:
    workflows: ["Research Lab V3"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sibyl-research-v4-operational
  cancel-in-progress: false

jobs:
  research-v4:
    name: Real L2 shadow evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INPUT_DIR: ${{ github.workspace }}/research-v3-input
      OUTPUT_DIR: ${{ github.workspace }}/research-v4-output
      APP_ENV: github-trial
      TRADING_MODE: PAPER
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      COST_AUTHORIZED_USD: "0"
      AI_ANALYSIS_ENABLED: "false"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve exact PASS Research V3 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/research-lab-v3.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
            sha=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')
          fi
          [[ -n "$run_id" && -n "$sha" ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact canonical source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install existing backend dependencies
        working-directory: services/backend
        run: pip install -e .

      - name: Download and verify exact Research V3 evidence
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INPUT_DIR" "$OUTPUT_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --name "sibyl-research-v3-$SOURCE_RUN_ID" \
            --dir "$INPUT_DIR"
          test -s "$INPUT_DIR/trial-summary.json"
          test -s "$INPUT_DIR/research-v3-summary.json"
          test -s "$INPUT_DIR/research-journal-v3.jsonl.gz"
          test -s "$INPUT_DIR/SHA256SUMS"
          (cd "$INPUT_DIR" && sha256sum -c SHA256SUMS --ignore-missing)

      - name: Execute bounded operational Research Lab V4
        working-directory: services/backend
        env:
          APP_VERSION: ${{ steps.source.outputs.sha }}
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_V3_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_V3_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 6m \
            python -m app.research_v4_operational \
            --input-dir "$INPUT_DIR" \
            --output-dir "$OUTPUT_DIR"

      - name: Verify V4 safety and evidence contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/research-v4-summary.json"
          test -s "$OUTPUT_DIR/research-v4-summary.md"
          test -s "$OUTPUT_DIR/research-tape-v4.jsonl.gz"
          test -s "$OUTPUT_DIR/research-raw-v4.jsonl.gz"
          test -s "$OUTPUT_DIR/evidence-manifest-v4.json"
          grep -q '"status": "PASS"' "$OUTPUT_DIR/research-v4-summary.json"
          grep -q '"order_placement": false' "$OUTPUT_DIR/research-v4-summary.json"
          grep -q '"private_keys": false' "$OUTPUT_DIR/research-v4-summary.json"
          grep -q '"historical_fill_rewrite": false' "$OUTPUT_DIR/research-v4-summary.json"
          gzip -t "$OUTPUT_DIR/research-tape-v4.jsonl.gz"
          gzip -t "$OUTPUT_DIR/research-raw-v4.jsonl.gz"
          bash scripts/secret-scan.sh
          python scripts/freeze_manifest.py --check

      - name: Hash combined V3 + V4 evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUTPUT_DIR"
          : > SHA256SUMS
          for file in \
            trial-summary.json research-summary.json latency-summary.json \
            evidence-manifest.json research-v3-summary.json research-journal-v3.jsonl.gz \
            evidence-manifest-v3.json research-v4-summary.json research-v4-summary.md \
            research-tape-v4.jsonl.gz research-raw-v4.jsonl.gz evidence-manifest-v4.json; do
            if [[ -s "$file" ]]; then sha256sum "$file" >> SHA256SUMS; fi
          done
          test -s SHA256SUMS

      - name: Publish Research V4 summary
        shell: bash
        run: cat "$OUTPUT_DIR/research-v4-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined V3 + V4 audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sibyl-research-v4-${{ github.run_id }}
          path: |
            research-v4-output/trial-summary.json
            research-v4-output/research-summary.json
            research-v4-output/latency-summary.json
            research-v4-output/evidence-manifest.json
            research-v4-output/research-v3-summary.json
            research-v4-output/research-journal-v3.jsonl.gz
            research-v4-output/evidence-manifest-v3.json
            research-v4-output/research-v4-summary.json
            research-v4-output/research-v4-summary.md
            research-v4-output/research-tape-v4.jsonl.gz
            research-v4-output/research-raw-v4.jsonl.gz
            research-v4-output/evidence-manifest-v4.json
            research-v4-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
