name: GitHub PAPER V5 Truthful Execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-paper-v5.yml"
      - "services/backend/app/models_v5.py"
      - "services/backend/app/execution_v5.py"
      - "services/backend/app/paper_v5.py"
      - "services/backend/app/paper_v5_r3.py"
      - "services/backend/app/paper_v5_r4.py"
      - "services/backend/app/paper_v5_r42.py"
      - "services/backend/app/paper_v5_r43.py"
      - "services/backend/app/paper_v5_r44.py"
      - "services/backend/app/paper_v5_r45.py"
      - "services/backend/app/copy_timing_audit.py"
      - "services/backend/app/source_strategy.py"
      - "services/backend/app/scanner.py"
      - "services/backend/app/polymarket.py"
      - "services/backend/app/watchdogs.py"
      - "services/backend/app/db.py"
      - "services/backend/tests/test_execution_v5.py"
      - "services/backend/tests/test_paper_v5.py"
      - "services/backend/tests/test_paper_v5_r3.py"
      - "services/backend/tests/test_paper_v5_r4.py"
      - "services/backend/tests/test_paper_v5_r42.py"
      - "services/backend/tests/test_paper_v5_r43.py"
      - "services/backend/tests/test_paper_v5_r44.py"
      - "services/backend/tests/test_paper_v5_r45.py"
      - "services/backend/tests/test_copy_timing_audit.py"
      - "services/backend/tests/test_source_strategy.py"
      - "services/backend/tests/test_watchdogs.py"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Start a new clean R4.5 cohort instead of restoring rolling V5 state"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sibyl-github-paper-v5
  cancel-in-progress: false

jobs:
  truthful-paper-cycle:
    name: PAPER V5 truthful execution cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_DIR: ${{ github.workspace }}/.paper-v5-state
      OUTPUT_DIR: ${{ github.workspace }}/paper-v5-output
      RELEASE_TAG: github-paper-v5-state-v4-5
      DATABASE_URL: sqlite:///${{ github.workspace }}/.paper-v5-state/sibyl-v5.db
      APP_ENV: github-trial
      APP_VERSION: ${{ github.sha }}
      TRADING_MODE: PAPER
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      COST_AUTHORIZED_USD: "0"
      EVIDENCE_GENERATION: SIBYL_PAPER_V5_EXECUTION_REALISTIC
      INITIAL_BANKROLL_USD: "300"
      CANDIDATE_LIMIT: "6"
      TRACKED_WALLET_LIMIT: "3"
      SOURCE_STRATEGY_ACTIVITY_LIMIT: "1000"
      SOURCE_STRATEGY_MIN_TRADE_COUNT: "30"
      SOURCE_STRATEGY_MIN_PAIRED_CONDITIONS: "2"
      SOURCE_STRATEGY_MAX_PAIRED_TRADE_FRACTION: "0.25"
      ACTIVITY_LOOKBACK_SECONDS: "5400"
      ACTIVITY_FETCH_LIMIT: "2000"
      RISK_MAX_SIGNAL_AGE_SECONDS: "5400"
      HTTP_TIMEOUT_SECONDS: "20"
      AI_ANALYSIS_ENABLED: "false"
      RESEARCH_ENABLED: "false"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install backend
        working-directory: services/backend
        run: pip install -e .

      - name: Restore verified V5 state
        env:
          RESET_STATE: ${{ inputs.reset_state || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR" "$OUTPUT_DIR"
          if [[ "$RESET_STATE" == "true" ]]; then
            echo "Explicit clean R4.5 cohort requested."
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No R4.5 V5 state exists yet; starting clean and arming only prospective directional sources."
            exit 0
          fi
          gh release download "$RELEASE_TAG" --pattern "sibyl-v5.db.gz" --pattern "SHA256SUMS" --dir "$STATE_DIR" --clobber
          test -s "$STATE_DIR/sibyl-v5.db.gz"
          test -s "$STATE_DIR/SHA256SUMS"
          expected=$(awk '$2=="sibyl-v5.db.gz" {print $1}' "$STATE_DIR/SHA256SUMS")
          actual=$(sha256sum "$STATE_DIR/sibyl-v5.db.gz" | awk '{print $1}')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" == "$expected" ]]
          gzip -t "$STATE_DIR/sibyl-v5.db.gz"
          gzip -dc "$STATE_DIR/sibyl-v5.db.gz" > "$STATE_DIR/sibyl-v5.db"
          rm -f "$STATE_DIR/sibyl-v5.db.gz" "$STATE_DIR/SHA256SUMS"
          echo "Verified R4.5 V5 state restored."

      - name: Verify import and truth contract
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app
          ! grep -nE '\.midpoint\(' app/paper_v5.py app/paper_v5_r3.py app/paper_v5_r4.py app/paper_v5_r42.py app/paper_v5_r43.py app/paper_v5_r44.py app/paper_v5_r45.py
          grep -q 'PAPER_V5_R4_5_REGIME_EVIDENCE_2026_08_09' app/paper_v5_r45.py
          grep -q 'regime_context_in_ledger' app/paper_v5_r45.py
          grep -q 'regime_execution_gate.*False' app/paper_v5_r45.py
          grep -q 'weekday_weekend_rule_imported.*False' app/paper_v5_r45.py
          grep -q 'time_of_day_rule_imported.*False' app/paper_v5_r45.py
          grep -q 'naive_strategy_inversion.*False' app/paper_v5_r45.py
          grep -q 'regime_pnl_requires_single_fill_asset_no_exit' app/paper_v5_r45.py
          grep -q 'regime_unattributable_pnl_excluded' app/paper_v5_r45.py
          grep -q 'source_strategy_gate' app/paper_v5_r44.py
          grep -q 'execution_evidence_hash_includes_source_strategy' app/paper_v5_r44.py
          grep -q 'maker_or_lp_execution_imported.*False' app/paper_v5_r44.py
          grep -q 'live_order_path_added.*False' app/paper_v5_r44.py
          grep -q 'prospective_wallet_selection' app/paper_v5_r43.py
          grep -q 'post_delay_market_state_revalidation' app/paper_v5_r42.py
          grep -q 'shadow_self_impact' app/paper_v5_r42.py
          grep -q 'public_book_hash_bridge_persisted' app/paper_v5_r42.py
          grep -q 'Gamma market.secondsDelay' app/paper_v5_r4.py
          grep -q 'systemic_market_data_adapter_failure' app/paper_v5.py
          grep -q 'historical source-wallet TRADE price' app/copy_timing_audit.py
          grep -q 'arbitrary_max_age_filter_imported' app/copy_timing_audit.py

      - name: Execute bounded PAPER V5 cycle
        id: cycle
        continue-on-error: true
        working-directory: services/backend
        run: timeout --signal=TERM --kill-after=30s 12m python -m app.paper_v5_r45 --output-dir "$OUTPUT_DIR"

      - name: Package diagnostic state and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$STATE_DIR/sibyl-v5.db" ]]; then
            gzip -c "$STATE_DIR/sibyl-v5.db" > "$OUTPUT_DIR/sibyl-v5.db.gz"
            gzip -t "$OUTPUT_DIR/sibyl-v5.db.gz"
          fi
          test -s "$OUTPUT_DIR/paper-v5-summary.json"
          test -s "$OUTPUT_DIR/paper-v5-summary.md"
          test -f "$OUTPUT_DIR/prediction-ledger-v5.jsonl"
          test -s "$OUTPUT_DIR/evidence-manifest-v5.json"
          grep -q '"cohort_id": "PAPER_V5_R4_5_REGIME_EVIDENCE_2026_08_09"' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"midpoint_fills": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"legacy_history_rewritten": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"order_placement": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"live_available": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"source_strategy_gate": true' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"source_strategy_fail_closed": true' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"regime_context_in_ledger": true' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"regime_execution_gate": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"weekday_weekend_rule_imported": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"time_of_day_rule_imported": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"naive_strategy_inversion": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"regime_pnl_requires_single_fill_asset_no_exit": true' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"regime_unattributable_pnl_excluded": true' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"maker_or_lp_execution_imported": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"live_order_path_added": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"state": "PASS"' "$OUTPUT_DIR/paper-v5-summary.json"
          ! grep -q '"state": "RED"' "$OUTPUT_DIR/paper-v5-summary.json"

      - name: Build copy timing and artifact contract
        if: always()
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          python -m app.copy_timing_audit "$OUTPUT_DIR/prediction-ledger-v5.jsonl" "$OUTPUT_DIR/copy-timing-analysis.json"
          test -s "$OUTPUT_DIR/copy-timing-analysis.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          manifest_path = root / "evidence-manifest-v5.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          roles = {
              "paper-v5-summary.json": "canonical_summary",
              "paper-v5-summary.md": "human_readable_summary",
              "prediction-ledger-v5.jsonl": "immutable_prediction_execution_ledger",
              "copy-timing-analysis.json": "derived_source_to_book_timing_evidence",
              "sibyl-v5.db.gz": "compressed_diagnostic_state",
          }
          packaged = {}
          for name, role in roles.items():
              path = root / name
              included = path.is_file() and path.stat().st_size > 0
              packaged[name] = {
                  "included": included,
                  "role": role,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest() if included else None,
              }
          manifest["artifact_contract"] = {
              "primary_evidence": ["paper-v5-summary.json", "prediction-ledger-v5.jsonl"],
              "auxiliary_evidence": ["paper-v5-summary.md", "copy-timing-analysis.json", "sibyl-v5.db.gz"],
              "packaged_files": packaged,
              "sha256sums_scope": "all included package files plus the finalized evidence manifest",
              "manifest_self_hash": "listed only in SHA256SUMS after manifest finalization",
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Reconcile summary ledger and evidence chains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          summary = json.loads((root / "paper-v5-summary.json").read_text())
          rows = [json.loads(line) for line in (root / "prediction-ledger-v5.jsonl").read_text().splitlines() if line.strip()]
          timing = json.loads((root / "copy-timing-analysis.json").read_text())
          manifest = json.loads((root / "evidence-manifest-v5.json").read_text())
          totals = summary["totals"]
          method = summary["methodology"]
          selection = summary["selection_provenance"]
          strategy = summary["source_strategy_provenance"]
          regime = summary["regime_provenance"]
          regime_analysis = summary["regime_analysis"]
          assert summary["evidence_reconciliation"]["state"] == "PASS"
          assert summary["execution_health"]["state"] != "RED"
          assert selection["state"] == "PASS"
          assert strategy["state"] == "PASS"
          assert regime["state"] == "PASS"
          assert regime_analysis["automatic_execution_gate"] is False
          assert regime_analysis["out_of_sample_confirmation_required"] is True
          assert regime_analysis["naive_strategy_inversion_allowed"] is False
          assert timing["automatic_execution_gate"] is False
          assert timing["arbitrary_max_age_filter_imported"] is False
          assert timing["rows_total"] == len(rows)
          assert "historical source-wallet TRADE price" in timing["source_price_semantics"]
          contract = manifest["artifact_contract"]
          packaged = contract["packaged_files"]
          for required in (
              "paper-v5-summary.json",
              "paper-v5-summary.md",
              "prediction-ledger-v5.jsonl",
              "copy-timing-analysis.json",
          ):
              assert packaged[required]["included"] is True
              assert len(packaged[required]["sha256"] or "") == 64
          db_included = (root / "sibyl-v5.db.gz").is_file() and (root / "sibyl-v5.db.gz").stat().st_size > 0
          assert packaged["sibyl-v5.db.gz"]["included"] is db_included
          if db_included:
              assert len(packaged["sibyl-v5.db.gz"]["sha256"] or "") == 64
          resolved = int(regime_analysis.get("resolved_directional_observations") or 0)
          attributable = int(regime_analysis.get("attributable_economic_observations") or 0)
          unattributable = int(regime_analysis.get("unattributable_economic_observations") or 0)
          assert 0 <= attributable <= resolved
          assert unattributable == resolved - attributable
          assert int(selection["next_selection_effective_at"] or 0) > 0
          assert int(selection.get("selection_provenance_hash_mismatches") or 0) == 0
          assert int(selection.get("selection_execution_evidence_bridge_mismatches") or 0) == 0
          assert int(strategy.get("missing_prediction_profiles") or 0) == 0
          assert int(strategy.get("profile_hash_mismatches") or 0) == 0
          assert int(strategy.get("non_directional_predictions") or 0) == 0
          assert int(strategy.get("execution_evidence_bridge_mismatches") or 0) == 0
          assert int(regime.get("missing_prediction_contexts") or 0) == 0
          assert int(regime.get("context_hash_or_timestamp_mismatches") or 0) == 0
          assert int(regime.get("execution_evidence_bridge_mismatches") or 0) == 0
          assert method["market_identity_exact"] is True
          assert method["post_delay_market_state_revalidation"] is True
          assert method["shadow_self_impact"] is True
          assert method["prospective_wallet_selection"] is True
          assert method["preselection_activity_backfill"] is False
          assert method["end_cycle_mark_uses_shadow_client"] is True
          assert method["source_strategy_gate"] is True
          assert method["source_strategy_public_activity_only"] is True
          assert method["source_strategy_point_in_time_cutoff"] is True
          assert method["source_strategy_fail_closed"] is True
          assert method["maker_rebate_source_rejected"] is True
          assert method["split_merge_conversion_source_rejected"] is True
          assert method["repeated_two_sided_source_rejected"] is True
          assert method["maker_or_lp_execution_imported"] is False
          assert method["live_order_path_added"] is False
          assert method["regime_context_in_ledger"] is True
          assert method["regime_context_utc_only"] is True
          assert method["execution_evidence_hash_includes_regime_context"] is True
          assert method["regime_analysis_settled_only"] is True
          assert method["regime_filters_research_only"] is True
          assert method["regime_execution_gate"] is False
          assert method["weekday_weekend_rule_imported"] is False
          assert method["time_of_day_rule_imported"] is False
          assert method["naive_strategy_inversion"] is False
          assert method["loss_cluster_metrics_settled_only"] is True
          assert method["regime_pnl_requires_single_fill_asset_no_exit"] is True
          assert method["regime_unattributable_pnl_excluded"] is True
          assert method["regime_filter_requires_out_of_sample_confirmation"] is True
          assert len(rows) == totals["executions"] == totals["predictions"]
          counts = Counter(row["execution"]["status"] for row in rows)
          assert counts["FILLED"] + counts["PARTIAL_FILLED"] == totals["filled_orders"]
          assert counts["NO_FILL"] == totals["no_fills"]
          assert counts["REJECTED"] == totals["rejected"]
          for row in rows:
              execution = row["execution"]
              selection_provenance = row.get("selection_provenance") or {}
              strategy_provenance = row.get("source_strategy_provenance") or {}
              regime_provenance = row.get("regime_provenance") or {}
              context = row.get("regime_context") or {}
              profile = strategy_provenance.get("source_strategy_profile") or {}
              evidence = row.get("execution_evidence") or {}
              assert selection_provenance.get("prospective_selection") is True
              assert int(selection_provenance["source_timestamp"]) >= int(selection_provenance["selection_effective_at"])
              assert len(selection_provenance.get("selection_provenance_hash") or "") == 64
              assert profile.get("classification") == "DIRECTIONAL_CANDIDATE"
              assert profile.get("directional") is True
              assert len(profile.get("activity_sample_hash") or "") == 64
              assert len(profile.get("evidence_hash") or "") == 64
              assert int(context.get("source_timestamp") or 0) == int(selection_provenance["source_timestamp"])
              assert context.get("weekpart") in {"WEEKDAY", "WEEKEND"}
              assert 0 <= int(context.get("utc_hour")) <= 23
              assert len(context.get("regime_context_hash") or "") == 64
              assert row.get("book_timing") is not None
              assert execution["simulated_latency_ms"] == 0
              assert row.get("copy_decay") is not None
              assert row.get("fee_provenance") is not None
              if evidence.get("execution_evidence_hash") is not None:
                  assert row.get("selection_evidence_bound") is True
                  assert row.get("source_strategy_evidence_bound") is True
                  assert row.get("regime_evidence_bound") is True
                  assert len(selection_provenance.get("r4_3_execution_evidence_hash") or "") == 64
                  assert strategy_provenance.get("r4_3_execution_evidence_hash") == selection_provenance.get("r4_3_execution_evidence_hash")
                  assert len(strategy_provenance.get("r4_4_execution_evidence_hash") or "") == 64
                  assert regime_provenance.get("r4_4_execution_evidence_hash") == strategy_provenance.get("r4_4_execution_evidence_hash")
                  assert len(regime_provenance.get("r4_5_execution_evidence_hash") or "") == 64
                  assert regime_provenance["r4_5_execution_evidence_hash"] == evidence["execution_evidence_hash"]
              else:
                  assert row.get("selection_evidence_bound") is None
                  assert row.get("source_strategy_evidence_bound") is None
                  assert row.get("regime_evidence_bound") is None
              if execution["status"] in {"FILLED", "PARTIAL_FILLED"}:
                  assert evidence.get("decision_received_at_ms") is not None
                  assert evidence.get("arrival_received_at_ms") is not None
                  assert evidence.get("actual_gap_ms") is not None
                  assert row["copy_decay"]["effective_fill_vs_source"] is not None
          cycle = summary["cycle"]
          assert cycle["signals_processed"] == cycle["new_predictions_created"] == cycle["new_executions_created"]
          PY

      - name: Hash exact V5 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUTPUT_DIR"
          files=(paper-v5-summary.json paper-v5-summary.md prediction-ledger-v5.jsonl evidence-manifest-v5.json copy-timing-analysis.json)
          if [[ -s sibyl-v5.db.gz ]]; then files+=(sibyl-v5.db.gz); fi
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Publish V5 run summary
        if: always()
        run: cat "$OUTPUT_DIR/paper-v5-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable V5 audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sibyl-paper-v5-${{ github.run_id }}
          path: |
            paper-v5-output/paper-v5-summary.json
            paper-v5-output/paper-v5-summary.md
            paper-v5-output/prediction-ledger-v5.jsonl
            paper-v5-output/evidence-manifest-v5.json
            paper-v5-output/copy-timing-analysis.json
            paper-v5-output/sibyl-v5.db.gz
            paper-v5-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Advance private rolling V5 state only on PASS
        if: steps.cycle.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/sibyl-v5.db.gz"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Sibyl Trace rolling PAPER V5 R4.5 state" --notes "Private regime-evidence R4.5 PAPER state. No automatic regime filters, no keys, no LIVE, zero authorized cost." --prerelease
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true
          fi
          gh release upload "$RELEASE_TAG" "$OUTPUT_DIR/sibyl-v5.db.gz" "$OUTPUT_DIR/paper-v5-summary.json" "$OUTPUT_DIR/paper-v5-summary.md" "$OUTPUT_DIR/prediction-ledger-v5.jsonl" "$OUTPUT_DIR/evidence-manifest-v5.json" "$OUTPUT_DIR/copy-timing-analysis.json" "$OUTPUT_DIR/SHA256SUMS" --clobber

      - name: Fail closed on degraded V5 cycle
        if: steps.cycle.outcome != 'success'
        run: |
          echo "V5 R4.5 evidence was retained for audit, but canonical rolling state was NOT advanced."
          exit 1
