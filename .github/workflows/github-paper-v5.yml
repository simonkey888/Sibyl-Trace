name: GitHub PAPER V5 Truthful Execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-paper-v5.yml"
      - "services/backend/app/models_v5.py"
      - "services/backend/app/execution_v5.py"
      - "services/backend/app/paper_v5.py"
      - "services/backend/app/paper_v5_r3.py"
      - "services/backend/app/paper_v5_r4.py"
      - "services/backend/app/polymarket.py"
      - "services/backend/app/db.py"
      - "services/backend/tests/test_execution_v5.py"
      - "services/backend/tests/test_paper_v5.py"
      - "services/backend/tests/test_paper_v5_r3.py"
      - "services/backend/tests/test_paper_v5_r4.py"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Start a new clean V5 cohort instead of restoring rolling V5 state"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sibyl-github-paper-v5
  cancel-in-progress: false

jobs:
  truthful-paper-cycle:
    name: PAPER V5 truthful execution cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_DIR: ${{ github.workspace }}/.paper-v5-state
      OUTPUT_DIR: ${{ github.workspace }}/paper-v5-output
      RELEASE_TAG: github-paper-v5-state-v4-1
      DATABASE_URL: sqlite:///${{ github.workspace }}/.paper-v5-state/sibyl-v5.db
      APP_ENV: github-trial
      APP_VERSION: ${{ github.sha }}
      TRADING_MODE: PAPER
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      COST_AUTHORIZED_USD: "0"
      EVIDENCE_GENERATION: SIBYL_PAPER_V5_EXECUTION_REALISTIC
      INITIAL_BANKROLL_USD: "300"
      CANDIDATE_LIMIT: "6"
      TRACKED_WALLET_LIMIT: "3"
      ACTIVITY_LOOKBACK_SECONDS: "5400"
      ACTIVITY_FETCH_LIMIT: "2000"
      RISK_MAX_SIGNAL_AGE_SECONDS: "5400"
      HTTP_TIMEOUT_SECONDS: "20"
      AI_ANALYSIS_ENABLED: "false"
      RESEARCH_ENABLED: "false"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install backend
        working-directory: services/backend
        run: pip install -e .

      - name: Restore verified V5 state
        env:
          RESET_STATE: ${{ inputs.reset_state || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR" "$OUTPUT_DIR"
          if [[ "$RESET_STATE" == "true" ]]; then
            echo "Explicit clean R4.1 cohort requested."
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No R4.1 V5 state exists yet; starting clean."
            exit 0
          fi
          gh release download "$RELEASE_TAG" \
            --pattern "sibyl-v5.db.gz" \
            --pattern "SHA256SUMS" \
            --dir "$STATE_DIR" \
            --clobber
          test -s "$STATE_DIR/sibyl-v5.db.gz"
          test -s "$STATE_DIR/SHA256SUMS"
          expected=$(awk '$2=="sibyl-v5.db.gz" {print $1}' "$STATE_DIR/SHA256SUMS")
          actual=$(sha256sum "$STATE_DIR/sibyl-v5.db.gz" | awk '{print $1}')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$actual" == "$expected" ]]
          gzip -t "$STATE_DIR/sibyl-v5.db.gz"
          gzip -dc "$STATE_DIR/sibyl-v5.db.gz" > "$STATE_DIR/sibyl-v5.db"
          rm -f "$STATE_DIR/sibyl-v5.db.gz" "$STATE_DIR/SHA256SUMS"
          echo "Verified R4.1 V5 state restored."

      - name: Verify import and truth contract
        working-directory: services/backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app
          ! grep -nE '\.midpoint\(' app/paper_v5.py app/paper_v5_r3.py app/paper_v5_r4.py
          grep -q 'PAPER_V5_R4_1_REPORT_PUBLISH_TRUTH_2026_08_07' app/paper_v5_r4.py
          grep -q 'Gamma market.secondsDelay' app/paper_v5_r4.py
          grep -q 'markets/slug/' app/paper_v5_r4.py
          grep -q 'synthetic_canonical_latency.*False' app/paper_v5_r4.py
          grep -q 'active_market_book_404' app/paper_v5_r4.py
          grep -q 'execution_evidence_hash' app/paper_v5_r4.py
          grep -q 'summary_ledger_reconciliation' app/paper_v5_r4.py
          grep -q 'systemic_market_data_adapter_failure' app/paper_v5.py

      - name: Execute bounded PAPER V5 cycle
        id: cycle
        continue-on-error: true
        working-directory: services/backend
        run: timeout --signal=TERM --kill-after=30s 12m python -m app.paper_v5_r4 --output-dir "$OUTPUT_DIR"

      - name: Package diagnostic state and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$STATE_DIR/sibyl-v5.db" ]]; then
            gzip -c "$STATE_DIR/sibyl-v5.db" > "$OUTPUT_DIR/sibyl-v5.db.gz"
            gzip -t "$OUTPUT_DIR/sibyl-v5.db.gz"
          fi
          test -s "$OUTPUT_DIR/paper-v5-summary.json"
          test -s "$OUTPUT_DIR/paper-v5-summary.md"
          test -f "$OUTPUT_DIR/prediction-ledger-v5.jsonl"
          test -s "$OUTPUT_DIR/evidence-manifest-v5.json"
          grep -q '"cohort_id": "PAPER_V5_R4_1_REPORT_PUBLISH_TRUTH_2026_08_07"' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"midpoint_fills": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"legacy_history_rewritten": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"order_placement": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"live_available": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"synthetic_canonical_latency": false' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"market_identity_exact": true' "$OUTPUT_DIR/paper-v5-summary.json"
          grep -q '"state": "PASS"' "$OUTPUT_DIR/paper-v5-summary.json"
          ! grep -q '"state": "RED"' "$OUTPUT_DIR/paper-v5-summary.json"
          ! grep -q 'official 250ms CLOB itode window' "$OUTPUT_DIR/paper-v5-summary.json"

      - name: Reconcile summary ledger and execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          summary = json.loads((root / "paper-v5-summary.json").read_text())
          rows = [json.loads(line) for line in (root / "prediction-ledger-v5.jsonl").read_text().splitlines() if line.strip()]
          totals = summary["totals"]
          method = summary["methodology"]
          assert summary["evidence_reconciliation"]["state"] == "PASS"
          assert summary["execution_health"]["state"] != "RED"
          assert method["synthetic_canonical_latency"] is False
          assert method["delayed_market_arrival_delay_ms"] is None
          assert method["regular_arrival_delay_ms"] is None
          assert method["market_identity_exact"] is True
          assert len(rows) == totals["executions"] == totals["predictions"]
          counts = Counter(row["execution"]["status"] for row in rows)
          assert counts["FILLED"] + counts["PARTIAL_FILLED"] == totals["filled_orders"]
          assert counts["NO_FILL"] == totals["no_fills"]
          assert counts["REJECTED"] == totals["rejected"]
          for row in rows:
              execution = row["execution"]
              assert execution["simulated_latency_ms"] == 0
              if execution["status"] in {"FILLED", "PARTIAL_FILLED"}:
                  evidence = row.get("execution_evidence") or {}
                  assert len(evidence.get("execution_evidence_hash") or "") == 64
                  assert evidence.get("decision_received_at_ms") is not None
                  assert evidence.get("arrival_received_at_ms") is not None
                  assert evidence.get("actual_gap_ms") is not None
          cycle = summary["cycle"]
          assert cycle["signals_processed"] == cycle["new_predictions_created"] == cycle["new_executions_created"]
          PY

      - name: Hash exact V5 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUTPUT_DIR"
          files=(paper-v5-summary.json paper-v5-summary.md prediction-ledger-v5.jsonl evidence-manifest-v5.json)
          if [[ -s sibyl-v5.db.gz ]]; then files+=(sibyl-v5.db.gz); fi
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Publish V5 run summary
        if: always()
        run: cat "$OUTPUT_DIR/paper-v5-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable V5 audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sibyl-paper-v5-${{ github.run_id }}
          path: |
            paper-v5-output/paper-v5-summary.json
            paper-v5-output/paper-v5-summary.md
            paper-v5-output/prediction-ledger-v5.jsonl
            paper-v5-output/evidence-manifest-v5.json
            paper-v5-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Advance private rolling V5 state only on PASS
        if: steps.cycle.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_DIR/sibyl-v5.db.gz"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Sibyl Trace rolling PAPER V5 R4.1 state" \
              --notes "Private truth-closed R4.1 PAPER state. No keys, no LIVE, zero authorized cost." \
              --prerelease
          else
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          fi
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR/sibyl-v5.db.gz" \
            "$OUTPUT_DIR/paper-v5-summary.json" \
            "$OUTPUT_DIR/paper-v5-summary.md" \
            "$OUTPUT_DIR/evidence-manifest-v5.json" \
            "$OUTPUT_DIR/SHA256SUMS" \
            --clobber

      - name: Fail closed on degraded V5 cycle
        if: steps.cycle.outcome != 'success'
        run: |
          echo "V5 R4.1 evidence was retained for audit, but canonical rolling state was NOT advanced."
          exit 1
