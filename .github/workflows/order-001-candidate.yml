name: ORDER-001 Candidate Verification

on:
  pull_request:
    paths:
      - "services/backend/**"
      - "apps/gateway/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "evidence/freeze/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-001-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-paper:
    name: exact-head PAPER candidate no-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_DIR: ${{ github.workspace }}/.order-001-state
      OUTPUT_DIR: ${{ github.workspace }}/order-001-output
      DATABASE_URL: sqlite:///${{ github.workspace }}/.order-001-state/sibyl-v5.db
      APP_ENV: github-trial
      APP_VERSION: order-001-${{ github.event.pull_request.head.sha || github.sha }}
      TRADING_MODE: PAPER
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      COST_AUTHORIZED_USD: "0"
      EVIDENCE_GENERATION: SIBYL_PAPER_V5_EXECUTION_REALISTIC
      INITIAL_BANKROLL_USD: "300"
      CANDIDATE_LIMIT: "3"
      TRACKED_WALLET_LIMIT: "2"
      SOURCE_STRATEGY_ACTIVITY_LIMIT: "10000"
      SOURCE_STRATEGY_MIN_TRADE_COUNT: "30"
      SOURCE_STRATEGY_MIN_PAIRED_CONDITIONS: "2"
      SOURCE_STRATEGY_MAX_PAIRED_TRADE_FRACTION: "0.25"
      ACTIVITY_LOOKBACK_SECONDS: "5400"
      ACTIVITY_FETCH_LIMIT: "1000"
      RISK_MAX_SIGNAL_AGE_SECONDS: "5400"
      HTTP_TIMEOUT_SECONDS: "20"
      AI_ANALYSIS_ENABLED: "false"
      RESEARCH_ENABLED: "false"

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "$EXPECTED_SHA" ]]
          echo "ORDER_001_CANDIDATE_SHA=$actual"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install backend development dependencies
        working-directory: services/backend
        run: pip install -e '.[dev]'

      - name: Run adversarial correction suite
        working-directory: services/backend
        run: >-
          pytest -q
          tests/test_source_strategy.py
          tests/test_scoring.py
          tests/test_evidence_v1.py
          tests/test_evidence_lineage.py
          tests/test_ci_gate.py
          tests/test_paper_v5_adversarial_regressions.py
          tests/test_workflow_resilience.py
          tests/test_cloudflare_snapshot_r44.py
          tests/test_cloudflare_snapshot_r45.py

      - name: Execute fresh PAPER R4.5 research-only candidate cycle
        shell: bash
        working-directory: services/backend
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR" "$OUTPUT_DIR"
          timeout --signal=TERM --kill-after=30s 10m \
            python -m app.paper_v5_r45 --output-dir "$OUTPUT_DIR"
          test -s "$OUTPUT_DIR/paper-v5-summary.json"
          test -s "$OUTPUT_DIR/evidence-manifest-v5.json"
          test -f "$OUTPUT_DIR/prediction-ledger-v5.jsonl"

      - name: Verify candidate PAPER truth and accounting state
        shell: bash
        working-directory: services/backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          state = Path(os.environ["STATE_DIR"])
          summary = json.loads((output / "paper-v5-summary.json").read_text())
          assert summary["safety"]["trading_mode"] == "PAPER"
          assert summary["safety"]["live_available"] is False
          assert summary["safety"]["order_placement"] is False
          assert summary["safety"]["private_keys"] is False
          assert summary["safety"]["paid_apis"] is False
          assert summary["safety"]["cost_authorized_usd"] == 0
          method = summary["methodology"]
          assert method["source_strategy_complete_history_required"] is True
          assert method["maker_rebate_source_rejected"] is False
          assert method["maker_rebate_execution_style_only"] is True
          assert method["regime_execution_gate"] is False
          ledger = [
              json.loads(line)
              for line in (output / "prediction-ledger-v5.jsonl").read_text().splitlines()
              if line.strip()
          ]
          source_keys = [row.get("source_key") for row in ledger if row.get("source_key")]
          assert len(source_keys) == len(set(source_keys))
          db = sqlite3.connect(state / "sibyl-v5.db")
          try:
              assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          finally:
              db.close()
          print(f"ORDER_001_LEDGER_ROWS={len(ledger)}")
          print("ORDER_001_SQLITE_INTEGRITY=PASS")
          PY

      - name: Prove no production mutation capability exists in candidate workflow
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          ! grep -q 'gh release create\|gh release upload\|wrangler deploy' \
            .github/workflows/order-001-candidate.yml
          echo "ORDER_001_NO_PRODUCTION_MUTATION=PASS"

      - name: Upload candidate audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: order-001-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            order-001-output/paper-v5-summary.json
            order-001-output/paper-v5-summary.md
            order-001-output/prediction-ledger-v5.jsonl
            order-001-output/evidence-manifest-v5.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
