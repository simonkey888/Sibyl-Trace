name: Sibyl V6 Runtime Verification

on:
  pull_request:
  push:
    branches:
      - "feat/sibyl-v6-cross-market-mm-r1"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  paper-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run bounded real-feed PAPER observer
        env:
          PYTHONPATH: v6
          DRY_RUN: "true"
          SIBYL_V6_LIVE_ALLOWED: "false"
          SIBYL_V6_RUN_UPSTREAM: "0"
          SIBYL_V6_EVIDENCE_BACKEND: "FILE"
          SIBYL_V6_FILE_STORE_ROOT: /tmp/sibyl-v6-runtime/store
          SIBYL_V6_AUTHORITATIVE_AUDIT_EVIDENCE: /tmp/sibyl-v6-runtime/authoritative-audit.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-runtime
          python -m sibyl_v6.paper_cloud_loop \
            --cycles 3 --interval 1 \
            --evidence /tmp/sibyl-v6-runtime/cycle-000001.json \
            | tee /tmp/sibyl-v6-runtime/stdout.jsonl
      - name: Summarize runtime profile and economics safely
        run: |
          python - <<'PY' | tee /tmp/sibyl-v6-runtime/profile-summary.txt
          import json
          import math
          import statistics
          from pathlib import Path

          paths = sorted(Path('/tmp/sibyl-v6-runtime').glob('cycle-*.json'))
          rows = [json.loads(path.read_text(encoding='utf-8')) for path in paths]
          assert len(rows) == 3, len(rows)
          assert all(row.get('DRY_RUN') is True for row in rows)
          assert all(row.get('LIVE') == 'NO' for row in rows)
          assert all(row.get('REAL_ORDERS') == 0 for row in rows)
          assert all(str(row.get('CAPITAL_MOVED_USD')) == '0' for row in rows)

          runtime_rows = [row for row in rows if isinstance(row.get('runtime_profile'), dict)]
          rss = [int(row['runtime_profile']['RSS_PEAK_KB']) for row in runtime_rows]
          cpu_ms = [float(row['runtime_profile']['CPU_PROCESS_MS']) for row in runtime_rows]
          cpu_ratio = [float(row['runtime_profile']['CPU_TO_WALL_RATIO']) for row in runtime_rows]
          latency = [float(row['cycle_latency_ms']) for row in rows if row.get('cycle_latency_ms') is not None]
          assert rss and latency

          ordered = sorted(latency)
          p50 = statistics.median(ordered)
          p95 = ordered[max(0, math.ceil(0.95 * len(ordered)) - 1)]
          reconnects = {
              'limitless': sum(int(row.get('runtime_profile', {}).get('reconnects', {}).get('limitless', 0)) for row in rows),
              'polymarket': sum(int(row.get('runtime_profile', {}).get('reconnects', {}).get('polymarket', 0)) for row in rows),
          }
          http_errors = sum(1 for row in rows if row.get('MARKET_DATA_CYCLE') != 'PASS')
          stale_rejections = 0
          incomplete_rejections = 0
          edge_samples = []
          for row in rows:
              mechanics = row.get('paper_mechanics') or {}
              if mechanics and not mechanics.get('fair_value_frame_complete', False):
                  incomplete_rejections += 1
              cycle_stale = False
              cycle_incomplete = False
              for side_name in ('YES', 'NO'):
                  side = mechanics.get(side_name) or {}
                  reason = str(side.get('REJECTION_REASON') or '')
                  if 'STALE' in reason or side.get('HEDGE_BOOK_STATUS') == 'STALE' or side.get('LIMITLESS_BOOK_STATUS') == 'STALE':
                      cycle_stale = True
                  if 'INSUFFICIENT_HEDGE_DEPTH' in reason or side.get('HEDGE_DEPTH_SUFFICIENT') is False:
                      cycle_incomplete = True
                  edge = side.get('EXPECTED_NET_EDGE')
                  if isinstance(edge, (int, float)):
                      edge_samples.append(float(edge))
              stale_rejections += int(cycle_stale)
              incomplete_rejections += int(cycle_incomplete and mechanics.get('fair_value_frame_complete', False))

          exact_pair_count = max(int(row.get('EXACT_EQUIVALENT_PAIR_COUNT', 0)) for row in rows)
          quoteable = sum(1 for row in rows if row.get('STRATEGY_QUOTEABLE') == 'YES')
          non_quoteable = sum(1 for row in rows if row.get('STRATEGY_QUOTEABLE') == 'NO')
          evidence_bytes = [int(row.get('evidence_bytes_per_cycle', 0)) for row in rows]

          assert http_errors == 0, rows
          assert exact_pair_count >= 1, exact_pair_count
          assert quoteable + non_quoteable == len(rows)

          summary = {
              'SOURCE_SHA': rows[0].get('SOURCE_SHA'),
              'CYCLE_COUNT': len(rows),
              'RSS_MIN_KB': min(rss),
              'RSS_PEAK_KB': max(rss),
              'CPU_PROFILE': {'process_ms': cpu_ms, 'cpu_to_wall_ratio': cpu_ratio},
              'CYCLE_LATENCY_P50_MS': round(p50, 3),
              'CYCLE_LATENCY_P95_MS': round(p95, 3),
              'RECONNECTS': reconnects,
              'HTTP_ERRORS': http_errors,
              'STALE_REJECTIONS': stale_rejections,
              'INCOMPLETE_BOOK_REJECTIONS': incomplete_rejections,
              'EXACT_PAIR_COUNT': exact_pair_count,
              'QUOTEABLE_CYCLES': quoteable,
              'NON_QUOTEABLE_CYCLES': non_quoteable,
              'NET_EDGE_SAMPLES': edge_samples,
              'EVIDENCE_BYTES_PER_CYCLE': evidence_bytes,
              'DISCOVERY_CYCLE': 'PASS',
              'MARKET_DATA_CYCLE': 'PASS',
              'REAL_ORDERS': 0,
              'CAPITAL_MOVED_USD': 0,
              'LIVE': 'NO',
              'TARGET_80_STATUS': 'UNPROVEN',
              'PROFITABILITY_CLAIM': False,
          }
          Path('/tmp/sibyl-v6-runtime/profile-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, sort_keys=True))
          print('PROFILING=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-runtime-profile-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-runtime
          if-no-files-found: error
          retention-days: 14

  evidence-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_PROBE_AUTHORIZED: ${{ vars.SIBYL_V6_R2_LIVE_PROBE_AUTHORIZED }}
      SIBYL_V6_R2_ACCOUNT_ID: ${{ secrets.SIBYL_V6_R2_ACCOUNT_ID }}
      SIBYL_V6_R2_BUCKET: ${{ secrets.SIBYL_V6_R2_BUCKET }}
      SIBYL_V6_R2_ACCESS_KEY_ID: ${{ secrets.SIBYL_V6_R2_ACCESS_KEY_ID }}
      SIBYL_V6_R2_SECRET_ACCESS_KEY: ${{ secrets.SIBYL_V6_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify compute-independent store contracts
        env:
          PYTHONPATH: v6
        run: |
          python -m unittest discover -s v6/tests -p 'test_quote_and_evidence.py' -v
          echo 'FILE_STORE=PASS'
          echo 'FILE_RESTART_DURABILITY_CLAIM=NO'
          echo 'R2_STORE_CONTRACT=PASS'
          echo 'GCS_STORE_CONTRACT=PASS'
          echo 'GCP_METADATA_REQUIRED_FOR_BOOT=NO'
      - name: Probe configured authorized zero-cost R2 durability if available
        env:
          PYTHONPATH: v6
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-store
          missing=()
          [[ "$R2_PROBE_AUTHORIZED" == "true" ]] || missing+=(SIBYL_V6_R2_LIVE_PROBE_AUTHORIZED=true)
          for name in SIBYL_V6_R2_ACCOUNT_ID SIBYL_V6_R2_BUCKET SIBYL_V6_R2_ACCESS_KEY_ID SIBYL_V6_R2_SECRET_ACCESS_KEY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            MISSING="$(IFS=,; echo "${missing[*]}")" python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'R2_LIVE_PUT_GET': 'NOT_RUN',
              'reason': 'MISSING_EXTERNAL_AUTHORIZED_CONFIGURATION',
              'missing': os.environ['MISSING'].split(','),
              'trading_secrets_required': False,
          }
          Path('/tmp/sibyl-v6-store/r2-live-probe.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          PY
          else
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from sibyl_v6.evidence_store import R2EvidenceStore

          def make_store():
              return R2EvidenceStore(
                  os.environ['SIBYL_V6_R2_ACCOUNT_ID'],
                  os.environ['SIBYL_V6_R2_BUCKET'],
                  os.environ['SIBYL_V6_R2_ACCESS_KEY_ID'],
                  os.environ['SIBYL_V6_R2_SECRET_ACCESS_KEY'],
              )

          key = f"sibyl-v6-zero-cost-probe/{os.environ['SOURCE_SHA']}/durability.json"
          first = json.dumps({'source_sha': os.environ['SOURCE_SHA'], 'version': 1}, sort_keys=True).encode()
          second = json.dumps({'source_sha': os.environ['SOURCE_SHA'], 'version': 2}, sort_keys=True).encode()
          store = make_store()
          store.put_bytes(key, first)
          got_first = store.get_bytes(key)
          assert hashlib.sha256(got_first).digest() == hashlib.sha256(first).digest()
          store.put_bytes(key, second)
          got_second = store.get_bytes(key)
          assert hashlib.sha256(got_second).digest() == hashlib.sha256(second).digest()
          restarted_store = make_store()
          recovered = restarted_store.get_bytes(key)
          assert hashlib.sha256(recovered).digest() == hashlib.sha256(second).digest()
          payload = {
              'R2_LIVE_PUT_GET': 'PASS',
              'PUT': 'PASS',
              'GET': 'PASS',
              'CONTENT_HASH_EQUALITY': 'PASS',
              'OVERWRITE_LATEST_READ': 'PASS',
              'READ_AFTER_CLIENT_RESTART': 'PASS',
              'storage_class': 'STANDARD',
              'trading_secrets_required': False,
          }
          Path('/tmp/sibyl-v6-store/r2-live-probe.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-store-verification-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-store
          if-no-files-found: error
          retention-days: 14

  cloudflare-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_TERMINAL_URL: https://sibyl-trace.simondalmasso44.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Probe public read-only R4.5 terminal
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-cloudflare
          root_status=$(curl --retry 4 --retry-delay 2 --silent --show-error -D /tmp/sibyl-v6-cloudflare/root.headers -o /tmp/sibyl-v6-cloudflare/root.html -w '%{http_code}' "$PUBLIC_TERMINAL_URL/")
          snapshot_status=$(curl --retry 4 --retry-delay 2 --silent --show-error -D /tmp/sibyl-v6-cloudflare/snapshot.headers -o /tmp/sibyl-v6-cloudflare/snapshot.json -w '%{http_code}' "$PUBLIC_TERMINAL_URL/data/snapshot.json?verify=$GITHUB_RUN_ID")
          api_status=$(curl --retry 4 --retry-delay 2 --silent --show-error -o /tmp/sibyl-v6-cloudflare/api.json -w '%{http_code}' "$PUBLIC_TERMINAL_URL/api/status")
          post_status=$(curl --retry 4 --retry-delay 2 --silent --show-error -X POST -o /tmp/sibyl-v6-cloudflare/post.txt -w '%{http_code}' "$PUBLIC_TERMINAL_URL/")
          test "$root_status" = 200
          test "$snapshot_status" = 200
          test "$api_status" = 404
          test "$post_status" = 405
          ROOT_STATUS="$root_status" SNAPSHOT_STATUS="$snapshot_status" API_STATUS="$api_status" POST_STATUS="$post_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          snapshot = json.loads(Path('/tmp/sibyl-v6-cloudflare/snapshot.json').read_text(encoding='utf-8'))
          api = json.loads(Path('/tmp/sibyl-v6-cloudflare/api.json').read_text(encoding='utf-8'))
          headers = Path('/tmp/sibyl-v6-cloudflare/root.headers').read_text(encoding='utf-8').lower()
          contract = snapshot.get('truth_contract') or {}
          score = contract.get('quality_score') or {}
          assert snapshot.get('schema_version') == 5
          assert contract.get('canonical_publisher_workflow') == 'publish-cloudflare-terminal-v5.yml'
          assert contract.get('single_public_writer_required') is True
          assert contract.get('live_available') is False
          assert contract.get('profitability_proven') is False
          assert score.get('calibrated_probability') is False
          assert score.get('expected_return_claim') is False
          assert score.get('alpha_claim') is False
          assert api.get('detail') == 'API and control routes are disabled on the public PAPER terminal'
          assert 'x-content-type-options: nosniff' in headers
          assert 'x-frame-options: deny' in headers
          serialized = json.dumps(snapshot).casefold()
          for forbidden in ('private_key', 'seed_phrase', 'mnemonic', 'bearer_token', 'access_token', 'refresh_token'):
              assert forbidden not in serialized
          payload = {
              'PUBLIC_CLOUDFLARE_TERMINAL': 'HEALTHY',
              'ROOT_HTTP': int(os.environ['ROOT_STATUS']),
              'SNAPSHOT_HTTP': int(os.environ['SNAPSHOT_STATUS']),
              'API_BOUNDARY_HTTP': int(os.environ['API_STATUS']),
              'POST_BOUNDARY_HTTP': int(os.environ['POST_STATUS']),
              'READ_ONLY': True,
              'NO_EXECUTION_AUTHORITY': True,
              'NO_SECRET_EXPOSURE': True,
              'R45_REGRESSION': 'NO',
          }
          Path('/tmp/sibyl-v6-cloudflare/regression-summary.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-cloudflare-regression-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-cloudflare
          if-no-files-found: error
          retention-days: 14
