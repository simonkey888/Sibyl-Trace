name: GitHub PAPER Trial

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-paper-trial.yml"
      - "services/backend/app/**"
      - "services/backend/pyproject.toml"
      - "evidence/freeze/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Discard the persisted PAPER database before this cycle"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sibyl-github-paper-trial
  cancel-in-progress: false

jobs:
  paper-cycle:
    name: PAPER V2 research cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_DIR: ${{ github.workspace }}/.trial-state
      OUTPUT_DIR: ${{ github.workspace }}/trial-output
      RELEASE_TAG: github-paper-state-v1
      DATABASE_URL: sqlite:///${{ github.workspace }}/.trial-state/sibyl.db
      APP_ENV: github-trial
      APP_VERSION: ${{ github.sha }}
      TRADING_MODE: PAPER
      PAPER_TRADING_ENABLED: "true"
      LIVE_TRADING_ENABLED: "false"
      COST_AUTHORIZED_USD: "0"
      EVIDENCE_GENERATION: SIBYL_PAPER_V2
      INITIAL_BANKROLL_USD: "300"
      CANDIDATE_LIMIT: "6"
      TRACKED_WALLET_LIMIT: "3"
      ACTIVITY_LOOKBACK_SECONDS: "5400"
      ACTIVITY_FETCH_LIMIT: "2000"
      RISK_MAX_SIGNAL_AGE_SECONDS: "5400"
      HTTP_TIMEOUT_SECONDS: "20"
      RESEARCH_ENABLED: "true"
      LATENCY_LAB_ENABLED: "true"
      LATENCY_CAPTURE_SECONDS: "15"
      LATENCY_REQUESTED_SHARES: "5"
      REFERENCE_RESEARCH_ENABLED: "true"
      REFERENCE_USERNAMES: djdjdjekekek,okkokok
      SPORTS_FAIR_PRICE_ENABLED: "true"
      WEATHER_RESEARCH_ENABLED: "true"
      AI_ANALYSIS_ENABLED: "false"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install backend
        working-directory: services/backend
        run: pip install -e .

      - name: Restore and verify private PAPER state
        env:
          RESET_STATE: ${{ inputs.reset_state || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR" "$OUTPUT_DIR"
          if [[ "$RESET_STATE" == "true" ]]; then
            echo "State reset requested."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" \
              --pattern "sibyl.db.gz" \
              --pattern "SHA256SUMS" \
              --dir "$STATE_DIR" \
              --clobber
            test -s "$STATE_DIR/sibyl.db.gz"
            test -s "$STATE_DIR/SHA256SUMS"
            EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$STATE_DIR/SHA256SUMS" | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid SHA256SUMS payload; refusing to restore persisted PAPER state."
              exit 1
            fi
            ACTUAL_SHA="$(sha256sum "$STATE_DIR/sibyl.db.gz" | awk '{print $1}')"
            if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
              echo "Persisted PAPER state checksum mismatch; refusing to restore."
              exit 1
            fi
            gzip -t "$STATE_DIR/sibyl.db.gz"
            gzip -dc "$STATE_DIR/sibyl.db.gz" > "$STATE_DIR/sibyl.db"
            rm -f "$STATE_DIR/sibyl.db.gz" "$STATE_DIR/SHA256SUMS"
            echo "Previous PAPER state restored and verified."
          else
            echo "No previous PAPER state found; starting clean."
          fi

      - name: Verify import surface
        working-directory: services/backend
        run: python -m compileall -q app

      - name: Execute one bounded PAPER V2 cycle
        id: cycle
        continue-on-error: true
        working-directory: services/backend
        run: timeout --signal=TERM --kill-after=30s 12m python -m app.paper_v2 --output-dir "$OUTPUT_DIR"

      - name: Package current state
        if: always()
        run: |
          set -euo pipefail
          test -s "$STATE_DIR/sibyl.db"
          gzip -c "$STATE_DIR/sibyl.db" > "$OUTPUT_DIR/sibyl.db.gz"
          gzip -t "$OUTPUT_DIR/sibyl.db.gz"

      - name: Ensure an audit report exists
        if: always()
        env:
          CYCLE_OUTCOME: ${{ steps.cycle.outcome }}
        run: |
          set -euo pipefail
          if [[ -s "$OUTPUT_DIR/trial-summary.json" && -s "$OUTPUT_DIR/trial-summary.md" ]]; then
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          output.mkdir(parents=True, exist_ok=True)
          completed = datetime.now(UTC).isoformat()
          outcome = os.environ.get("CYCLE_OUTCOME", "unknown")
          payload = {
              "schema_version": 3,
              "evidence_generation": "SIBYL_PAPER_V2",
              "run": {
                  "status": "FAILED",
                  "profile": "GITHUB_PAPER_RESEARCH_V2",
                  "completed_at": completed,
                  "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "github_sha": os.environ.get("GITHUB_SHA", ""),
                  "errors": [{
                      "phase": "bounded_cycle",
                      "type": "WorkflowOutcome",
                      "message": f"Cycle ended with outcome {outcome} before report generation",
                  }],
              },
              "safety": {
                  "trading_mode": "PAPER",
                  "live_available": False,
                  "cost_authorized_usd": 0,
              },
          }
          (output / "trial-summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (output / "trial-summary.md").write_text(
              "# Sibyl Trace PAPER V2 cycle\n\n"
              f"**Status:** `FAILED`  \n**Outcome:** `{outcome}`  \n"
              "The last committed SQLite state was preserved and packaged.\n",
              encoding="utf-8",
          )
          PY

      - name: Hash persisted state and evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$OUTPUT_DIR"
          files=(sibyl.db.gz trial-summary.json trial-summary.md)
          for optional in latency-summary.json latency-summary.md research-summary.json evidence-manifest.json; do
            if [[ -s "$optional" ]]; then files+=("$optional"); fi
          done
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Publish run summary
        if: always()
        run: |
          cat "$OUTPUT_DIR/trial-summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$OUTPUT_DIR/latency-summary.md" ]]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$OUTPUT_DIR/latency-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sibyl-paper-v2-${{ github.run_id }}
          path: |
            trial-output/trial-summary.json
            trial-output/trial-summary.md
            trial-output/latency-summary.json
            trial-output/latency-summary.md
            trial-output/research-summary.json
            trial-output/evidence-manifest.json
            trial-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Persist rolling state in private release
        if: always()
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Sibyl Trace rolling PAPER state" \
              --notes "Private rolling PAPER V2 research state. No keys, no live credentials, zero authorized cost." \
              --prerelease
          else
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          fi
          assets=(
            "$OUTPUT_DIR/sibyl.db.gz"
            "$OUTPUT_DIR/trial-summary.json"
            "$OUTPUT_DIR/trial-summary.md"
            "$OUTPUT_DIR/SHA256SUMS"
          )
          for optional in latency-summary.json latency-summary.md research-summary.json evidence-manifest.json; do
            if [[ -s "$OUTPUT_DIR/$optional" ]]; then assets+=("$OUTPUT_DIR/$optional"); fi
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Fail closed on degraded cycle
        if: steps.cycle.outcome != 'success'
        run: |
          echo "The PAPER V2 cycle was persisted but one or more phases degraded or timed out."
          exit 1
