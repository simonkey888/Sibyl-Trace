name: Sibyl V6 Polymarket WS Diagnostic

on:
  pull_request:
  push:
    branches:
      - "feat/sibyl-v6-cross-market-mm-r1"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  poly-ws-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Diagnose exact-pair Polymarket market WebSocket
        env:
          PYTHONPATH: v6
        run: |
          python - <<'PY'
          import json
          from sibyl_v6.live_pair_selector import audit_current_pairs
          from sibyl_v6.runtime_market_data import fetch_runtime_market_data

          audit = audit_current_pairs()
          exact = [row for row in (audit.get('exact_pairs') or []) if isinstance(row, dict)]
          if not exact:
              raise SystemExit('NO_CURRENT_EXACT_PAIR')
          pair = sorted(exact, key=lambda row: (str(row.get('limitless_slug') or ''), str(row.get('polymarket_slug') or '')))[0]
          runtime = fetch_runtime_market_data(pair, audit)
          p = runtime['polymarket']
          safe = {
              'source_sha': __import__('os').environ['SOURCE_SHA'],
              'pair': {'limitless_slug': pair['limitless_slug'], 'polymarket_slug': pair['polymarket_slug']},
              'ws_state': p['ws_state'],
              'book_status': p['book_status'],
              'book_source': p['book_source'],
              'ws_rest_top_reconciled': p['ws_rest_top_reconciled'],
              'token_map_matches': p['token_map_matches'],
              'market_tradeable': p['tradeable'],
          }
          print(json.dumps(safe, sort_keys=True))
          assert safe['ws_state']['status'] == 'FRESH', safe
          assert all(value == 'FRESH' for value in safe['book_status'].values()), safe
          assert all(safe['ws_rest_top_reconciled'].values()), safe
          print('POLY_WS_FRESHNESS_AUTHORITY=PASS')
          PY
