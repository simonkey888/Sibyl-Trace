name: V5 R2 Patch Once

on:
  push:
    branches: [fix/paper-v5-r2-clob-contract]
    paths: [".github/workflows/v5-r2-patch-once.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/paper-v5-r2-clob-contract
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply evidence-backed R2 code corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cohort = "PAPER_V5_R2_CLOB_FEE_CURVE_2026_08_07"

          path = Path("services/backend/app/execution_v5.py")
          text = path.read_text()
          text = text.replace("exponent != 2", "exponent != 1")
          text = text.replace(
              'order_delay_ms=1000 if info.get("itode") is True else 0,',
              'order_delay_ms=250 if info.get("itode") is True else 0,',
          )
          path.write_text(text)

          path = Path("services/backend/tests/test_execution_v5.py")
          text = path.read_text()
          text = text.replace(
              '{"r": "0.07", "e": 2, "to": True}',
              '{"r": "0.07", "e": 1, "to": True}',
              2,
          )
          text = text.replace(
              "assert delayed.order_delay_ms == 1000",
              "assert delayed.order_delay_ms == 250",
          )
          invalid = (
              '{"mts": "0.01", "mos": "5", '
              '"fd": {"r": "0.07", "e": 1, "to": True}}\n        )\n'
          )
          text = text.replace(
              invalid,
              invalid.replace('"e": 1', '"e": 2'),
              1,
          )
          path.write_text(text)

          path = Path("services/backend/app/paper_v5.py")
          text = path.read_text()
          text = text.replace(
              'LEGACY_LABEL = "LEGACY_SIMULATION_MIDPOINT_V2"\n',
              f'LEGACY_LABEL = "LEGACY_SIMULATION_MIDPOINT_V2"\n'
              f'COHORT_ID = "{cohort}"\n',
          )
          text = text.replace(
              'f"market_data_unavailable:{type(exc).__name__}"',
              'f"market_data_unavailable:{type(exc).__name__}:{str(exc)[:120]}"',
          )
          text = text.replace(
              'f"arrival_book_unavailable:{type(exc).__name__}"',
              'f"arrival_book_unavailable:{type(exc).__name__}:{str(exc)[:120]}"',
          )
          marker = '\ndef build_report(\n'
          helper = '''\ndef execution_health_v5(db: Session) -> dict[str, Any]:\n    adapter_failures = int(\n        db.scalar(\n            select(func.count())\n            .select_from(PaperV5Execution)\n            .where(PaperV5Execution.reason.like("market_data_unavailable:%"))\n        )\n        or 0\n    )\n    decision_books_reached = int(\n        db.scalar(\n            select(func.count())\n            .select_from(PaperV5Execution)\n            .where(PaperV5Execution.decision_book_hash.is_not(None))\n        )\n        or 0\n    )\n    arrival_failures = int(\n        db.scalar(\n            select(func.count())\n            .select_from(PaperV5Execution)\n            .where(PaperV5Execution.reason.like("arrival_book_unavailable:%"))\n        )\n        or 0\n    )\n    arrival_books_reached = int(\n        db.scalar(\n            select(func.count())\n            .select_from(PaperV5Execution)\n            .where(PaperV5Execution.arrival_book_hash.is_not(None))\n        )\n        or 0\n    )\n    errors: list[str] = []\n    if adapter_failures > 0 and decision_books_reached == 0:\n        errors.append(f"systemic_market_data_adapter_failure:{adapter_failures}")\n    if arrival_failures > 0 and arrival_books_reached == 0:\n        errors.append(f"systemic_arrival_book_failure:{arrival_failures}")\n    if errors:\n        state = "RED"\n    elif adapter_failures or arrival_failures:\n        state = "YELLOW"\n    else:\n        state = "GREEN"\n    return {\n        "state": state,\n        "adapter_failures": adapter_failures,\n        "decision_books_reached": decision_books_reached,\n        "arrival_failures": arrival_failures,\n        "arrival_books_reached": arrival_books_reached,\n        "errors": errors,\n    }\n\n'''
          if "def execution_health_v5(" not in text:
              text = text.replace(marker, helper + marker)
          text = text.replace(
              "    completed_at = utcnow()\n"
              "    accuracy = wins / (wins + losses) if wins + losses else None\n"
              '    is_pass = not errors and accounting.state != "RED"\n',
              "    completed_at = utcnow()\n"
              "    accuracy = wins / (wins + losses) if wins + losses else None\n"
              '    execution_health = execution_health_v5(db)\n'
              '    run_errors = list(errors) + list(execution_health["errors"])\n'
              '    is_pass = not run_errors and accounting.state != "RED"\n',
          )
          text = text.replace(
              '        "schema_version": 5,\n'
              '        "evidence_generation": EVIDENCE_GENERATION,',
              '        "schema_version": 5,\n'
              '        "cohort_id": COHORT_ID,\n'
              '        "evidence_generation": EVIDENCE_GENERATION,',
              1,
          )
          text = text.replace(
              '            "errors": errors,',
              '            "errors": run_errors,',
              1,
          )
          text = text.replace(
              '            "delayed_market_arrival_delay_ms": 1000,\n'
              '            "delayed_market_arrival_delay_basis": "CLOB itode flag",',
              '            "delayed_market_arrival_delay_ms": 250,\n'
              '            "delayed_market_arrival_delay_basis": '
              '"official 250ms CLOB itode window",',
          )
          text = text.replace(
              '        "accounting_watchdog": {\n',
              '        "execution_health": execution_health,\n'
              '        "accounting_watchdog": {\n',
              1,
          )
          text = text.replace(
              '        "schema_version": 5,\n'
              '        "evidence_generation": EVIDENCE_GENERATION,',
              '        "schema_version": 5,\n'
              '        "cohort_id": COHORT_ID,\n'
              '        "evidence_generation": EVIDENCE_GENERATION,',
              1,
          )
          path.write_text(text)

          path = Path("services/backend/tests/test_paper_v5.py")
          text = path.read_text()
          text = text.replace(
              "    current_portfolio_v5,\n    settle_v5,\n",
              "    current_portfolio_v5,\n"
              "    execution_health_v5,\n"
              "    settle_v5,\n",
          )
          text = text.replace(
              '{"r": "0.07", "e": 2, "to": True}',
              '{"r": "0.07", "e": 1, "to": True}',
          )
          if "test_systemic_adapter_failure_is_red" not in text:
              text += '''\n\ndef test_systemic_adapter_failure_is_red(monkeypatch) -> None:\n    class BadRulesClient(FakeClient):\n        def clob_market_info(self, _condition_id):\n            return {\n                "mts": "0.01",\n                "mos": "1",\n                "fd": {"r": "0.07", "e": 2, "to": True},\n            }\n\n    SessionLocal = factory()\n    client = BadRulesClient([order_book(asks=[(0.51, 100)], bids=[(0.49, 100)])])\n    monkeypatch.setattr("app.paper_v5.time.sleep", lambda _seconds: None)\n    with SessionLocal() as db:\n        initialize_state(db, settings())\n        wallet = add_wallet(db)\n        PaperEngineV5(settings(), client).process(\n            db, wallet, activity(tx="0xbad-rules")\n        )\n        health = execution_health_v5(db)\n        assert health["state"] == "RED"\n        assert health["adapter_failures"] == 1\n        assert health["decision_books_reached"] == 0\n        assert health["errors"] == [\n            "systemic_market_data_adapter_failure:1"\n        ]\n'''
          path.write_text(text)

          path = Path("services/backend/app/cloudflare_snapshot.py")
          text = path.read_text()
          text = text.replace(
              '        v5.get("status") != "PASS"\n'
              '        or v5.get("evidence_generation") '
              '!= "SIBYL_PAPER_V5_EXECUTION_REALISTIC"\n',
              '        v5.get("status") != "PASS"\n'
              f'        or v5.get("cohort_id") != "{cohort}"\n'
              '        or v5.get("evidence_generation") '
              '!= "SIBYL_PAPER_V5_EXECUTION_REALISTIC"\n',
          )
          path.write_text(text)

          path = Path("services/backend/tests/test_cloudflare_snapshot_v5.py")
          text = path.read_text()
          text = text.replace(
              '        "schema_version": 5,\n'
              '        "evidence_generation": "SIBYL_PAPER_V5_EXECUTION_REALISTIC",',
              '        "schema_version": 5,\n'
              f'        "cohort_id": "{cohort}",\n'
              '        "evidence_generation": "SIBYL_PAPER_V5_EXECUTION_REALISTIC",',
          )
          path.write_text(text)

          path = Path("docs/PAPER_V5_TRUTH_CONTRACT.md")
          text = path.read_text()
          text = text.replace(
              "documented delayed-market wait",
              "documented 250 ms delayed-market wait",
          )
          if "R2 correction" not in text:
              text += f'''\n## R2 correction — 2026-08-07\n\nThe first integrated V5 run is retained only as invalid-adapter audit evidence and is not canonical. A live public CLOB probe showed fee details `e=1` for sports/eSports (`r=0.05`) and BTC (`r=0.07`). R2 validates that observed/documented fee curve, uses the official 250 ms delayed-market window when `itode=true`, starts a fresh rolling state, and fails the run if adapter failures occur while zero decision books are reached. Cohort ID: `{cohort}`.\n'''
          path.write_text(text)
          PY

          python -m pip install --disable-pip-version-check ruff==0.12.3
          ruff format \
            services/backend/app/execution_v5.py \
            services/backend/app/paper_v5.py \
            services/backend/tests/test_execution_v5.py \
            services/backend/tests/test_paper_v5.py \
            services/backend/app/cloudflare_snapshot.py \
            services/backend/tests/test_cloudflare_snapshot_v5.py
          ruff check --fix \
            services/backend/app/execution_v5.py \
            services/backend/app/paper_v5.py \
            services/backend/tests/test_execution_v5.py \
            services/backend/tests/test_paper_v5.py \
            services/backend/app/cloudflare_snapshot.py \
            services/backend/tests/test_cloudflare_snapshot_v5.py
          grep -q 'exponent != 1' services/backend/app/execution_v5.py
          grep -q 'order_delay_ms=250' services/backend/app/execution_v5.py
          grep -q 'PAPER_V5_R2_CLOB_FEE_CURVE_2026_08_07' \
            services/backend/app/paper_v5.py
          grep -q 'systemic_market_data_adapter_failure' \
            services/backend/app/paper_v5.py

      - name: Commit R2 code correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend docs/PAPER_V5_TRUTH_CONTRACT.md
          git diff --cached --check
          git commit -m "fix(v5): align fee curve and fail closed on adapter outage"
          git push origin HEAD:fix/paper-v5-r2-clob-contract
