name: V5 R3 Format Once

on:
  push:
    branches: [fix/paper-v5-r3-intracycle-mark]
    paths: [".github/workflows/v5-r3-format-once.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/paper-v5-r3-intracycle-mark
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Format exact R3 files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.3
          files=(
            services/backend/app/execution_v5.py
            services/backend/app/paper_v5_r3.py
            services/backend/tests/test_paper_v5_r3.py
            services/backend/app/cloudflare_snapshot.py
            services/backend/tests/test_cloudflare_snapshot_v5.py
          )
          ruff format "${files[@]}"
          ruff check --fix "${files[@]}"
          ruff check "${files[@]}"
      - name: Commit formatter changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git commit -m "style(v5): format R3 execution correction"
          git push origin HEAD:fix/paper-v5-r3-intracycle-mark
