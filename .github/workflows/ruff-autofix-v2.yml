name: Ruff autofix V2

on:
  pull_request:
    branches: [main]
    paths:
      - "services/backend/**/*.py"
      - "services/backend/pyproject.toml"
      - ".github/workflows/ruff-autofix-v2.yml"

permissions:
  contents: write

concurrency:
  group: ruff-autofix-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Ruff only
        run: pip install ruff==0.16.1
      - name: Apply safe Ruff fixes
        working-directory: services/backend
        run: ruff check . --fix || true
      - name: Commit mechanical fixes when needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Ruff autofix changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend
          git commit -m "style: apply Ruff safe fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
