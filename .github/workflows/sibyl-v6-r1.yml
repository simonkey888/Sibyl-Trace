name: Sibyl V6 Cross-Market MM R1

on:
  pull_request:
    paths:
      - "v6/**"
      - ".github/workflows/sibyl-v6-r1.yml"
  push:
    branches:
      - "feat/sibyl-v6-cross-market-mm-r1"
    paths:
      - "v6/**"
      - ".github/workflows/sibyl-v6-r1.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Explicitly authorize GCP mutations for this exact branch head"
        required: true
        type: boolean
        default: false
      cost_authorized_usd:
        description: "Positive maximum technical cloud spend explicitly authorized for this run"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Deterministic V6 contracts
        env:
          PYTHONPATH: v6
        run: python -m unittest discover -s v6/tests -v
      - name: Compile V6
        run: python -m compileall -q v6

  public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Generic real public feed transport smoke
        env:
          PYTHONPATH: v6
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sibyl_v6.feeds import public_feed_smoke
          payload = public_feed_smoke()
          payload['source_sha'] = os.environ['SOURCE_SHA']
          Path('/tmp/sibyl-v6-evidence/public-feeds.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          assert payload['status'] == 'PASS', payload
          print('PUBLIC_FEEDS=PASS')
          PY
      - name: Discovery work exists without conflating candidate and exact
        env:
          PYTHONPATH: v6
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sibyl_v6.discovery import build_discovery_evidence
          path = Path('/tmp/sibyl-v6-evidence/pair-discovery.json')
          payload = build_discovery_evidence(path, Path('v6/config/verified_pairs.json'))
          payload['source_sha'] = os.environ['SOURCE_SHA']
          payload['DISCOVERY_HAS_WORK'] = payload['CANDIDATE_PAIR_COUNT'] > 0 or payload['EXACT_EQUIVALENT_PAIR_COUNT'] > 0
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          assert payload['DISCOVERY_HAS_WORK'], payload
          assert payload['candidate_semantics'] == 'SEMANTIC_EVENT_METADATA_ONLY_NOT_MATCHED'
          assert payload['exact_semantics'] == 'FULL_RULE_EQUIVALENCE_WITH_SOURCE_PAYLOAD_HASHES'
          print(f"CANDIDATE_PAIR_COUNT={payload['CANDIDATE_PAIR_COUNT']}")
          print(f"EXACT_EQUIVALENT_PAIR_COUNT={payload['EXACT_EQUIVALENT_PAIR_COUNT']}")
          PY
      - name: Full-L2 synthetic fill-to-hedge evidence
        env:
          PYTHONPATH: v6
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from sibyl_v6.simulate import write_simulated_hedge
          path = Path('/tmp/sibyl-v6-evidence/simulated-hedge.json')
          payload = write_simulated_hedge(path)
          payload['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          result = payload['result']
          assert payload['evidence_class'] == 'SYNTHETIC_PAPER_NOT_REAL_FILL'
          assert result['status'] == 'GREEN'
          assert result['L2_levels_consumed'] == 2
          assert result['hedge_fill_status'] == 'SUCCESS'
          assert result['partial_fill'] is False
          assert result['orphan_exposure'] == '0'
          print('SIMULATED_HEDGE_RESULT=GREEN_FULL_L2_SYNTHETIC')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-public-evidence-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-evidence
          if-no-files-found: error
          retention-days: 14

  exact-pair-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bounded PAPER cycle bound to same authoritative audit
        env:
          PYTHONPATH: v6
          DRY_RUN: "true"
          SIBYL_V6_LIVE_ALLOWED: "false"
          SIBYL_V6_RUN_UPSTREAM: "0"
          SIBYL_V6_EVIDENCE_BACKEND: "FILE"
          SIBYL_V6_FILE_STORE_ROOT: /tmp/sibyl-v6-file-store
          SIBYL_V6_AUTHORITATIVE_AUDIT_EVIDENCE: /tmp/sibyl-v6-exact-pair/authoritative-audit.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-exact-pair
          python -m sibyl_v6.paper_cloud_loop --once --evidence /tmp/sibyl-v6-exact-pair/cycle.json | tee /tmp/sibyl-v6-exact-pair/stdout.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          from sibyl_v6.exact_pair_contract import validate_exact_pair_cycle

          p = json.loads(Path('/tmp/sibyl-v6-exact-pair/cycle.json').read_text())
          audit = json.loads(Path('/tmp/sibyl-v6-exact-pair/authoritative-audit.json').read_text())
          selected = validate_exact_pair_cycle(p, audit)

          assert p['STRATEGY_QUOTEABLE'] in ('YES', 'NO')
          assert p['SIBYL_QUOTE_SAFETY'] == 'PASS'
          assert p['CAP_COMPLIANCE'] == 'PASS'
          assert p['NET_EDGE_GATE'] == 'PASS'
          assert p['REAL_FEEDS'] is True
          assert p['LIMITLESS_EXACT_BOOK_HTTP'] == 200
          assert p['POLY_EXACT_BOOK_HTTP'] == 200
          assert p['POLY_NO_EXACT_BOOK_HTTP'] == 200
          assert 'bid_levels' in p['limitless'] and 'ask_levels' in p['limitless']
          for outcome in ('YES', 'NO'):
              book = p['polymarket'][outcome]
              assert 'bid_levels' in book and 'ask_levels' in book
              assert 'best_executable_bid' in book and 'best_executable_ask' in book
              if book['source_timestamp_ms'] is None:
                  assert book['quote_age_ms'] is None
                  assert book['quote_age_status'] == 'UNKNOWN'
          frame = p['paper_mechanics']['fair_value_frame_complete']
          if frame:
              assert p['paper_mechanics']['computed_YES_BUY'] is not None
              assert p['paper_mechanics']['computed_NO_BUY'] is not None
              assert p['paper_mechanics']['YES_BUY_CAP'] is not None
              assert p['paper_mechanics']['NO_BUY_CAP'] is not None
          else:
              assert p['paper_mechanics']['computed_YES_BUY'] is None
              assert p['paper_mechanics']['computed_NO_BUY'] is None
              assert p['STRATEGY_QUOTEABLE'] == 'NO'
          assert p['paper_mechanics']['limitless_order_sides'] == ['YES_BUY', 'NO_BUY']
          assert p['paper_mechanics']['postOnly'] is True
          for side in ('YES', 'NO'):
              q = p['paper_mechanics'][side]
              for field in ('RAW_CAP','UPSTREAM_COMPUTED_PRICE','CAP_COMPLIANT','TICK_QUOTEABLE','EXECUTABLE_HEDGE_COST','FEES','EXPECTED_NET_EDGE','QUOTEABLE','REJECTION_REASON'):
                  assert field in q, (side, field, q)
              if q['QUOTEABLE']:
                  assert q['CAP_COMPLIANT'] is True
                  assert q['TICK_QUOTEABLE'] is True
                  assert q['HEDGE_DEPTH_SUFFICIENT'] is True
                  assert q['HEDGE_BOOK_STATUS'] == 'FRESH'
                  assert q['LIMITLESS_BOOK_STATUS'] == 'FRESH'
                  assert q['EXPECTED_NET_EDGE'] is not None
                  assert q['EXPECTED_NET_EDGE'] + 1e-12 >= q['MIN_EXPECTED_NET_EDGE']
          assert p['REAL_ORDERS'] == 0
          assert p['CAPITAL_MOVED_USD'] == '0'
          print('AUTHORITATIVE_SAME_CYCLE_BINDING=PASS')
          print('SELECTED_LIMITLESS=' + selected['limitless_slug'])
          print('SELECTED_POLYMARKET=' + selected['polymarket_slug'])
          print('MARKET_DATA_CYCLE=PASS')
          print('SIBYL_QUOTE_SAFETY=PASS')
          print('STRATEGY_QUOTEABLE=' + p['STRATEGY_QUOTEABLE'])
          print('R2_LIVE_PUT_GET=NOT_RUN')
          print('REAL_ORDERS=0')
          print('CAPITAL_MOVED_USD=0')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-exact-pair-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-exact-pair
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Clean build A
        run: docker build --pull --no-cache --tag sibyl-v6:a --file v6/Dockerfile .
      - name: Capture build A dependency provenance
        run: |
          mkdir -p /tmp/sibyl-v6-container-evidence
          docker run --rm --entrypoint cat sibyl-v6:a /opt/agents-starter/.sibyl-dependency-provenance.json > /tmp/sibyl-v6-container-evidence/dependency-a.json
          docker run --rm --entrypoint cat sibyl-v6:a /opt/agents-starter/.sibyl-patched-lock-sha256 > /tmp/sibyl-v6-container-evidence/lock-a.sha256
      - name: Remove build cache before build B
        run: docker builder prune --all --force
      - name: Clean build B
        run: docker build --pull --no-cache --tag sibyl-v6:b --file v6/Dockerfile .
      - name: Compare clean dependency provenance
        run: |
          docker run --rm --entrypoint cat sibyl-v6:b /opt/agents-starter/.sibyl-dependency-provenance.json > /tmp/sibyl-v6-container-evidence/dependency-b.json
          docker run --rm --entrypoint cat sibyl-v6:b /opt/agents-starter/.sibyl-patched-lock-sha256 > /tmp/sibyl-v6-container-evidence/lock-b.sha256
          cmp /tmp/sibyl-v6-container-evidence/dependency-a.json /tmp/sibyl-v6-container-evidence/dependency-b.json
          cmp /tmp/sibyl-v6-container-evidence/lock-a.sha256 /tmp/sibyl-v6-container-evidence/lock-b.sha256
          echo 'IMAGE_BUILD=PASS'
      - name: Verify pinned upstream and repaired lock provenance
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh sibyl-v6:b -lc '
            test "$(cat /opt/agents-starter/.sibyl-upstream-sha)" = "e35ad881f88c7b5d60388461095ee11b7aa161c5"
            test "$(git -C /opt/agents-starter rev-parse HEAD)" = "e35ad881f88c7b5d60388461095ee11b7aa161c5"
            test "$(sha256sum /opt/agents-starter/package-lock.json | awk "{print \$1}")" = "$(cat /opt/agents-starter/.sibyl-patched-lock-sha256)"
            python3 - <<"PY"
          import json
          p=json.load(open("/opt/agents-starter/.sibyl-dependency-provenance.json"))
          assert p["SOURCE_PROVENANCE_SHA"] == "e35ad881f88c7b5d60388461095ee11b7aa161c5"
          assert p["DEPENDENCY_RESOLUTION_PROVENANCE"].startswith("SIBYL_MINIMAL_LOCK_REPAIR:")
          assert len(p["LOCK_PATCH_HASH"]) == 64
          assert p["PACKAGE_INTEGRITY_HASHES"]["ox@0.14.26"] == "sha512-t68x49i+heyvHFp1iSq+JjgGyNGJ0AujNMTGXKt96sPGxX4T74c5QUE3LL57hDxGXYG/PM4sq2xCJ4/wCGOQ/w=="
          print("UPSTREAM_SOURCE_PROVENANCE=PASS")
          PY
          '
      - name: Verify image cannot arm LIVE
        run: |
          docker run --rm --entrypoint python3 sibyl-v6:b - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, '/app/v6')
          from sibyl_v6.preflight import dry_run_preflight
          result = dry_run_preflight(Path('/opt/agents-starter'), {})
          assert result.DRY_RUN_PREFLIGHT == 'PASS', result
          assert result.LIVE_PREFLIGHT == 'NOT_RUN', result
          print(result)
          PY
      - name: Quote math parity against pinned upstream computeBuyPrices
        run: |
          docker run --rm --entrypoint sh sibyl-v6:b -lc '
            set -eu
            cd /opt/agents-starter
            ./node_modules/.bin/tsx /app/v6/upstream_quote_parity.ts /app/v6/fixtures/quote_math_parity.json > /tmp/upstream-quotes.json
            cd /app
            python3 -m sibyl_v6.quote_parity /app/v6/fixtures/quote_math_parity.json /tmp/upstream-quotes.json
          ' | tee /tmp/sibyl-v6-container-evidence/quote-parity.txt
          grep -q '"QUOTE_MATH_PARITY": "PASS"' /tmp/sibyl-v6-container-evidence/quote-parity.txt
          echo 'UPSTREAM_PARITY_TEST=PASS'
      - name: Bounded 0.2-vCPU 512MB PAPER profile
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-profile && chmod 777 /tmp/sibyl-v6-profile
          docker run --rm --cpus=0.2 --memory=512m \
            -e SOURCE_SHA="$SOURCE_SHA" -e DRY_RUN=true \
            -e SIBYL_V6_LIVE_ALLOWED=false -e SIBYL_V6_RUN_UPSTREAM=0 \
            -e SIBYL_V6_EVIDENCE_BACKEND=FILE -e SIBYL_V6_FILE_STORE_ROOT=/evidence/store \
            -v /tmp/sibyl-v6-profile:/evidence --entrypoint python3 sibyl-v6:b \
            -m sibyl_v6.paper_cloud_loop --cycles 3 --interval 1 --evidence /evidence/cycle-000001.json \
            | tee /tmp/sibyl-v6-container-evidence/bounded-profile.jsonl
          python3 - <<'PY' | tee /tmp/sibyl-v6-container-evidence/profile-summary.txt
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path('/tmp/sibyl-v6-profile').glob('cycle-*.json'))]
          assert len(rows) == 3
          assert all(r['REAL_ORDERS']==0 and r['CAPITAL_MOVED_USD']=='0' for r in rows)
          rss=max(r['runtime_profile']['RSS_PEAK_KB'] for r in rows if 'runtime_profile' in r)
          assert rss < 512*1024
          print(f'RSS_PEAK={rss}KB')
          print('NORTHFLANK_COMPATIBLE=YES')
          PY
      - name: Verify Northflank readiness contract is mutation-free
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('v6/cloud/northflank-readiness.json'))
          assert p['mutation_authorized'] is False
          assert p['service'] == 'sibyl-v6-mm'
          assert p['dockerfile'] == 'v6/Dockerfile'
          assert p['resources'] == {'vcpu': 0.2, 'memory_mb': 512}
          assert p['environment']['DRY_RUN'] == 'true'
          assert p['environment']['SIBYL_V6_LIVE_ALLOWED'] == 'false'
          assert p['environment']['SIBYL_V6_RUN_UPSTREAM'] == '0'
          assert p['claims']['real_orders'] == 0
          assert p['claims']['capital_moved_usd'] == 0
          print('NORTHFLANK_READINESS=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-container-evidence-${{ env.SOURCE_SHA }}
          path: |
            /tmp/sibyl-v6-container-evidence
            /tmp/sibyl-v6-profile
          if-no-files-found: error
          retention-days: 14

  gcp-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.SIBYL_V6_GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.SIBYL_V6_GCP_WIF_PROVIDER }}
      GCP_BUILDER_SERVICE_ACCOUNT: ${{ vars.SIBYL_V6_GCP_BUILDER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Resolve remote GCP configuration without mutation
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p /tmp/sibyl-v6-gcp
          configured=true
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_BUILDER_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then configured=false; fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          printf '{"source_sha":"%s","gcp_configuration_present":%s,"mutation_attempted":false,"gcp_metadata_required_for_boot":false}\n' "$SOURCE_SHA" "$configured" > /tmp/sibyl-v6-gcp/configuration.json
          echo "GCP_CONFIGURATION_PRESENT=$configured"
      - name: Authenticate through keyless WIF
        if: steps.cfg.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_BUILDER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud
        if: steps.cfg.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Read-only GCP inventory
        if: steps.cfg.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format=json > /tmp/sibyl-v6-gcp/auth.json
          gcloud artifacts repositories list --project "$GCP_PROJECT_ID" --format=json > /tmp/sibyl-v6-gcp/artifact-repositories.json
          gcloud run worker-pools list --project "$GCP_PROJECT_ID" --format=json > /tmp/sibyl-v6-gcp/worker-pools.json
          gcloud storage buckets list --project "$GCP_PROJECT_ID" --format=json > /tmp/sibyl-v6-gcp/buckets.json
          gcloud secrets list --project "$GCP_PROJECT_ID" --format='json(name,createTime,replication)' > /tmp/sibyl-v6-gcp/secret-metadata.json
      - name: Record explicit unconfigured state
        if: steps.cfg.outputs.configured != 'true'
        run: |
          printf '%s\n' '{"GCP_AUTH":"UNCONFIGURED","mutation_attempted":false,"reason":"required repository variables absent","gcp_metadata_required_for_boot":false}' > /tmp/sibyl-v6-gcp/inventory-summary.json
          echo 'GCP_AUTH=UNCONFIGURED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-gcp-inventory-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-gcp
          if-no-files-found: error
          retention-days: 14

  gcp-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.SIBYL_V6_GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.SIBYL_V6_GCP_WIF_PROVIDER }}
      GCP_BUILDER_SERVICE_ACCOUNT: ${{ vars.SIBYL_V6_GCP_BUILDER_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.SIBYL_V6_GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_ARTIFACT_REGION: ${{ vars.SIBYL_V6_GCP_ARTIFACT_REGION }}
      GCP_ARTIFACT_REPO: ${{ vars.SIBYL_V6_GCP_ARTIFACT_REPO }}
      GCP_EVIDENCE_BUCKET: ${{ vars.SIBYL_V6_GCP_EVIDENCE_BUCKET }}
      COST_AUTHORIZED_USD: ${{ inputs.cost_authorized_usd }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Exact-head and explicit cloud mutation gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/sibyl-v6-cross-market-mm-r1'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_BUILDER_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT GCP_ARTIFACT_REGION GCP_ARTIFACT_REPO GCP_EVIDENCE_BUCKET; do
            test -n "${!name:-}" || { echo "GCP_DEPLOY_BLOCKED_MISSING_$name" >&2; exit 20; }
          done
          python3 - <<'PY'
          import os
          value = float(os.environ['COST_AUTHORIZED_USD'])
          if value <= 0:
              raise SystemExit('GCP_DEPLOY_BLOCKED_NO_POSITIVE_COST_AUTHORIZATION')
          PY
      - name: Authenticate builder through keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_BUILDER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build, push immutable digest, probe regions, deploy one PAPER worker
        shell: bash
        run: bash v6/cloud/build-push-probe-deploy.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-cloud-deployment-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-cloud-evidence
          if-no-files-found: error
          retention-days: 30
