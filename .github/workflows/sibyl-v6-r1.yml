name: Sibyl V6 Cross-Market MM R1

on:
  pull_request:
    paths:
      - "v6/**"
      - ".github/workflows/sibyl-v6-r1.yml"
  push:
    branches:
      - "feat/sibyl-v6-cross-market-mm-r1"
    paths:
      - "v6/**"
      - ".github/workflows/sibyl-v6-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Deterministic V6 safety and economics suite
        env:
          PYTHONPATH: v6
        run: python -m unittest discover -s v6/tests -v
      - name: Compile V6
        run: python -m compileall -q v6

  public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Real public Polymarket plus Limitless market/orderbook smoke
        env:
          PYTHONPATH: v6
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sibyl_v6.feeds import public_feed_smoke
          payload = public_feed_smoke()
          payload['source_sha'] = os.environ['SOURCE_SHA']
          Path('/tmp/sibyl-v6-evidence/public-feeds.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          assert payload['status'] == 'PASS', payload
          PY
      - name: Candidate discovery is explicitly not matching
        env:
          PYTHONPATH: v6
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sibyl_v6.discovery import build_discovery_evidence
          path = Path('/tmp/sibyl-v6-evidence/pair-discovery.json')
          payload = build_discovery_evidence(path, Path('v6/config/verified_pairs.json'))
          payload['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          assert payload['EXACT_EQUIVALENT_PAIR_COUNT'] == 0
          assert payload['candidate_semantics'] == 'TITLE_SIMILARITY_ONLY_NOT_MATCHED'
          print(f"CANDIDATE_PAIR_COUNT={payload['CANDIDATE_PAIR_COUNT']}")
          print("EXACT_EQUIVALENT_PAIR_COUNT=0")
          PY
      - name: Full-L2 synthetic fill-to-hedge evidence
        env:
          PYTHONPATH: v6
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sibyl_v6.simulate import write_simulated_hedge
          path = Path('/tmp/sibyl-v6-evidence/simulated-hedge.json')
          payload = write_simulated_hedge(path)
          payload['source_sha'] = os.environ['SOURCE_SHA']
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          result = payload['result']
          assert payload['evidence_class'] == 'SYNTHETIC_PAPER_NOT_REAL_FILL'
          assert result['status'] == 'GREEN'
          assert result['L2_levels_consumed'] == 2
          assert result['hedge_fill_status'] == 'SUCCESS'
          assert result['partial_fill'] is False
          assert result['orphan_exposure'] == '0'
          print('SIMULATED_HEDGE_RESULT=GREEN_FULL_L2_SYNTHETIC')
          print('SIMULATED_HEDGE_EVIDENCE_HASH=' + result['evidence_hash'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-public-evidence-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-evidence
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build immutable upstream-pinned V6 image
        run: docker build --pull --tag sibyl-v6:${SOURCE_SHA} --file v6/Dockerfile .
      - name: Verify image cannot arm LIVE and upstream provenance is exact
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python3 sibyl-v6:${SOURCE_SHA} - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, '/app/v6')
          from sibyl_v6.preflight import dry_run_preflight
          result = dry_run_preflight(Path('/opt/agents-starter'), {})
          assert result.DRY_RUN_PREFLIGHT == 'PASS', result
          assert result.LIVE_PREFLIGHT == 'NOT_RUN', result
          print(result)
          PY
      - name: Record local immutable image content id
        run: docker image inspect sibyl-v6:${SOURCE_SHA} --format 'IMAGE_ID={{.Id}}'

  gcp-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.SIBYL_V6_GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.SIBYL_V6_GCP_WIF_PROVIDER }}
      GCP_BUILDER_SERVICE_ACCOUNT: ${{ vars.SIBYL_V6_GCP_BUILDER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Resolve remote GCP configuration without mutation
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p /tmp/sibyl-v6-gcp
          configured=true
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_BUILDER_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then configured=false; fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          printf '{"source_sha":"%s","gcp_configuration_present":%s,"mutation_attempted":false}\n' "$SOURCE_SHA" "$configured" > /tmp/sibyl-v6-gcp/configuration.json
          echo "GCP_CONFIGURATION_PRESENT=$configured"
      - name: Authenticate through keyless WIF
        if: steps.cfg.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_BUILDER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud
        if: steps.cfg.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Read-only GCP inventory
        if: steps.cfg.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format=json > /tmp/sibyl-v6-gcp/auth.json
          gcloud artifacts repositories list --project "$GCP_PROJECT_ID" --format=json > /tmp/sibyl-v6-gcp/artifact-repositories.json
          gcloud run worker-pools list --project "$GCP_PROJECT_ID" --format=json > /tmp/sibyl-v6-gcp/worker-pools.json
          gcloud storage buckets list --project "$GCP_PROJECT_ID" --format=json > /tmp/sibyl-v6-gcp/buckets.json
          gcloud secrets list --project "$GCP_PROJECT_ID" --format='json(name,createTime,replication)' > /tmp/sibyl-v6-gcp/secret-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/sibyl-v6-gcp')
          out = {'gcp_configuration_present': True, 'mutation_attempted': False}
          for name in ('artifact-repositories','worker-pools','buckets','secret-metadata'):
              rows = json.loads((root / f'{name}.json').read_text())
              out[name.replace('-', '_') + '_count'] = len(rows)
          (root / 'inventory-summary.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY
      - name: Record explicit unconfigured state
        if: steps.cfg.outputs.configured != 'true'
        run: |
          printf '%s\n' '{"GCP_AUTH":"UNCONFIGURED","mutation_attempted":false,"reason":"required repository variables absent"}' > /tmp/sibyl-v6-gcp/inventory-summary.json
          echo 'GCP_AUTH=UNCONFIGURED'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-gcp-inventory-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-gcp
          if-no-files-found: error
          retention-days: 14
