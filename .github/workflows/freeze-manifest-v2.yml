name: PAPER V2 freeze generator

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/freeze-manifest-v2.yml"

permissions:
  contents: write

jobs:
  freeze:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/freeze_manifest.py --write
      - name: Commit refreshed freeze
        run: |
          set -euo pipefail
          git add evidence/freeze/SIBYL_PAPER_V2_MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh PAPER V2 frozen baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
