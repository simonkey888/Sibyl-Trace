name: V5 Format Once

on:
  push:
    branches: [feat/paper-v5-truthful-execution]
    paths: [".github/workflows/v5-format-once.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/paper-v5-truthful-execution
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fix stale methodology and format V5 Python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("services/backend/app/paper_v5.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"regular_arrival_delay_ms": 350,', '"regular_arrival_delay_ms": 0,')
          text = text.replace(
              '"delayed_market_arrival_delay_ms": 1000,',
              '"regular_arrival_delay_basis": "immediate public-book refetch; no synthetic delay",\n'
              '            "delayed_market_arrival_delay_ms": 1000,\n'
              '            "delayed_market_arrival_delay_basis": "CLOB itode flag",',
          )
          text = text.replace(
              '"marking": "net executable liquidation value against current bids; unfilled residual valued at zero",',
              '"marking": "net executable liquidation value; unfilled residual = zero",',
          )
          text = text.replace(
              '"accuracy_denominator": "resolved BUY predictions with non-zero simulated FAK fill only",',
              '"accuracy_denominator": "resolved filled BUY predictions only",',
          )
          if '"regular_arrival_delay_ms": 350,' in text:
              raise SystemExit("stale synthetic delay remains")
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.12.3
          ruff format services/backend/app/paper_v5.py services/backend/tests/test_paper_v5.py
          ruff check --fix services/backend/app/paper_v5.py services/backend/tests/test_paper_v5.py
          ! grep -n 'regular_arrival_delay_ms.*350' services/backend/app/paper_v5.py
          grep -n 'regular_arrival_delay_ms.*0' services/backend/app/paper_v5.py
      - name: Commit exact formatting corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend/app/paper_v5.py services/backend/tests/test_paper_v5.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git commit -m "style(v5): format truthful execution implementation"
          git push origin HEAD:feat/paper-v5-truthful-execution
