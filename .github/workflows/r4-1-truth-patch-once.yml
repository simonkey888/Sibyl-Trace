name: R4.1 Truth Patch Once
on:
  push:
    branches: [fix/paper-v5-r4-1-report-publish-truth]
    paths: [".github/workflows/r4-1-truth-patch-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/paper-v5-r4-1-report-publish-truth
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply R4.1 patch
        run: |
          python scripts/r4_1_truth_patch.py
          python scripts/r4_1_test_fix.py
      - name: Verify full backend and freeze
        run: |
          python -m pip install -q -e 'services/backend[dev]'
          cd services/backend
          ruff format app/paper_v5_r4.py app/cloudflare_snapshot.py tests/test_paper_v5_r4.py tests/test_cloudflare_snapshot_v5.py
          ruff check --fix app/paper_v5_r4.py app/cloudflare_snapshot.py tests/test_paper_v5_r4.py tests/test_cloudflare_snapshot_v5.py
          ruff check .
          pytest --cov=app --cov-report=term-missing --cov-fail-under=75
          cd ../..
          python scripts/freeze_manifest.py --check
      - name: Commit R4.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/github-paper-v5.yml services/backend
          git diff --cached --check
          git commit -m 'fix(v5): close R4.1 reporting and market identity truth'
          git push origin HEAD:fix/paper-v5-r4-1-report-publish-truth
