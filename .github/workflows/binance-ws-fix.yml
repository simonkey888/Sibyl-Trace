name: Binance market-data transport fix

on:
  push:
    branches: [fix/binance-market-data-only-ws]
    paths:
      - ".github/workflows/binance-ws-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/binance-market-data-only-ws
      - name: Switch to Binance official market-data-only WebSocket and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('services/backend/app/latency.py')
          old = 'wss://stream.binance.com:9443/ws/btcusdt@aggTrade'
          new = 'wss://data-stream.binance.vision/ws/btcusdt@aggTrade'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy Binance WebSocket endpoint')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/binance-ws-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/backend/app/latency.py
          git commit -m "fix: use Binance market-data-only websocket"
          git push origin HEAD:fix/binance-market-data-only-ws
