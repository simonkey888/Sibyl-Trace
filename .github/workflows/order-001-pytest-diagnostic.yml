name: ORDER-001 Temporary Pytest Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/order-001-pytest-diagnostic.yml"
      - "services/backend/**"

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    if: github.event.pull_request.head.ref == 'order-001-corrective-p0-p7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - working-directory: services/backend
        run: pip install -e '.[dev]'
      - name: Capture full pytest output
        working-directory: services/backend
        shell: bash
        run: |
          set +e
          pytest --cov=app --cov-report=term-missing --cov-fail-under=75 -vv > "$RUNNER_TEMP/order-001-pytest.txt" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/order-001-pytest.rc"
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: order-001-pytest-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/order-001-pytest.txt
            ${{ runner.temp }}/order-001-pytest.rc
          if-no-files-found: error
          retention-days: 1
