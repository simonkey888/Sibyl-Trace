name: PAPER V2 pytest warning cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test-warning-cleanup-v2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rename helper so pytest does not collect it
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/backend/tests/test_paper_v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('def test_session_factory():', 'def _session_factory():')
          text = text.replace('factory = test_session_factory()', 'factory = _session_factory()')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git add services/backend/tests/test_paper_v2.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: stop collecting session factory helper"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
