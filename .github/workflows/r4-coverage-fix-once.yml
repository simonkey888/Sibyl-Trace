name: R4 Coverage Fix Once
on:
  push:
    branches: [fix/paper-v5-audit-reconciliation-001]
    paths: [".github/workflows/r4-coverage-fix-once.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/paper-v5-audit-reconciliation-001
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply coverage test
        run: python scripts/r4_coverage_fix.py
      - name: Verify full backend and freeze
        run: |
          python -m pip install -q -e 'services/backend[dev]'
          cd services/backend
          ruff format tests/test_paper_v5_r4.py
          ruff check --fix tests/test_paper_v5_r4.py
          ruff check .
          pytest --cov=app --cov-report=term-missing --cov-fail-under=75
          cd ../..
          python scripts/freeze_manifest.py --check
      - name: Commit test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/backend/tests/test_paper_v5_r4.py
          git diff --cached --check
          git commit -m 'test(v5): verify R4 wrapper isolation'
          git push origin HEAD:fix/paper-v5-audit-reconciliation-001
