name: PAPER V2 contract fix
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/contract-fix-v2.yml"]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verified fee schedule and protect market contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/backend/app/polymarket.py')
          text = p.read_text()
          text = text.replace('"sports": 0.05,', '"sports": 0.03,')
          p.write_text(text)
          t = Path('services/backend/tests/test_polymarket_research.py')
          text = t.read_text().replace('("Sports") == pytest.approx(0.05)', '("Sports") == pytest.approx(0.03)')
          t.write_text(text)
          f = Path('scripts/freeze_manifest.py')
          text = f.read_text()
          text = text.replace(
              '    "services/backend/app/paper.py",\n',
              '    "services/backend/app/paper.py",\n    "services/backend/app/polymarket.py",\n    "services/backend/app/latency.py",\n    "services/backend/app/research.py",\n',
          )
          f.write_text(text)
          PY
      - name: Commit contract correction
        run: |
          set -euo pipefail
          git add services/backend/app/polymarket.py services/backend/tests/test_polymarket_research.py scripts/freeze_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align current Polymarket sports fee contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
