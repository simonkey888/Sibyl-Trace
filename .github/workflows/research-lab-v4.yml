name: Research Lab V4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "services/backend/app/**v4.py"
      - "services/backend/tests/**v4.py"
      - "services/backend/app/journal_v3.py"
      - "docs/MASTER_ORDER_RESEARCH_LAB_V4.md"
      - ".github/workflows/research-lab-v4.yml"

permissions:
  contents: read

jobs:
  shadow-v4:
    name: Deterministic V4 shadow evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend
        working-directory: services/backend
        run: pip install -e '.[dev]'
      - name: Run V4 focused tests
        working-directory: services/backend
        run: >-
          pytest
          tests/test_event_tape_v4.py
          tests/test_temporal_features_v4.py
          tests/test_market_parity_v4.py
          tests/test_benchmark_forecast_v4.py
          tests/test_journal_v4.py
      - name: Generate deterministic V4 shadow evidence
        working-directory: services/backend
        run: python -m app.v4_smoke --output ../../research-v4-smoke.json
      - name: Verify frozen PAPER boundaries
        run: |
          bash scripts/secret-scan.sh
          python scripts/freeze_manifest.py --check
          test -s research-v4-smoke.json
          grep -q '"order_placement": false' research-v4-smoke.json
          grep -q '"private_keys": false' research-v4-smoke.json
      - name: Hash smoke evidence
        run: sha256sum research-v4-smoke.json > research-v4-smoke.SHA256
      - name: Upload V4 smoke artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sibyl-research-v4-smoke-${{ github.run_id }}
          path: |
            research-v4-smoke.json
            research-v4-smoke.SHA256
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
