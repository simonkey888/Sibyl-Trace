name: Sibyl V6 PAPER Profile

on:
  pull_request:
  push:
    branches:
      - "feat/sibyl-v6-cross-market-mm-r1"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  paper-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert exact-head checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run bounded real-feed PAPER observer
        env:
          PYTHONPATH: v6
          DRY_RUN: "true"
          SIBYL_V6_LIVE_ALLOWED: "false"
          SIBYL_V6_RUN_UPSTREAM: "0"
          SIBYL_V6_EVIDENCE_BACKEND: "FILE"
          SIBYL_V6_FILE_STORE_ROOT: /tmp/sibyl-v6-runtime/store
          SIBYL_V6_AUTHORITATIVE_AUDIT_EVIDENCE: /tmp/sibyl-v6-runtime/authoritative-audit.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v6-runtime
          python -m sibyl_v6.paper_cloud_loop --cycles 3 --interval 1 \
            --evidence /tmp/sibyl-v6-runtime/cycle-000001.json \
            | tee /tmp/sibyl-v6-runtime/stdout.jsonl
      - name: Summarize bounded observer
        run: |
          python - <<'PY' | tee /tmp/sibyl-v6-runtime/profile-summary.txt
          import json
          import math
          import statistics
          from pathlib import Path

          rows = [json.loads(path.read_text(encoding='utf-8')) for path in sorted(Path('/tmp/sibyl-v6-runtime').glob('cycle-*.json'))]
          assert len(rows) == 3, len(rows)
          assert all(row.get('DRY_RUN') is True and row.get('LIVE') == 'NO' for row in rows)
          assert all(row.get('REAL_ORDERS') == 0 and str(row.get('CAPITAL_MOVED_USD')) == '0' for row in rows)
          assert all(row.get('DISCOVERY_CYCLE') == 'PASS' for row in rows)
          assert all(row.get('MARKET_DATA_CYCLE') == 'PASS' for row in rows)

          runtime = [row['runtime_profile'] for row in rows]
          rss = [int(item['RSS_PEAK_KB']) for item in runtime]
          cpu_ms = [float(item['CPU_PROCESS_MS']) for item in runtime]
          cpu_ratio = [float(item['CPU_TO_WALL_RATIO']) for item in runtime]
          latency = [float(row['cycle_latency_ms']) for row in rows]
          ordered = sorted(latency)
          p50 = statistics.median(ordered)
          p95 = ordered[max(0, math.ceil(0.95 * len(ordered)) - 1)]
          reconnects = {
              'limitless': sum(int(item.get('reconnects', {}).get('limitless', 0)) for item in runtime),
              'polymarket': sum(int(item.get('reconnects', {}).get('polymarket', 0)) for item in runtime),
          }
          stale = 0
          incomplete = 0
          edge_samples = []
          for row in rows:
              mechanics = row.get('paper_mechanics') or {}
              cycle_stale = False
              cycle_incomplete = not mechanics.get('fair_value_frame_complete', False)
              for side_name in ('YES', 'NO'):
                  side = mechanics.get(side_name) or {}
                  reason = str(side.get('REJECTION_REASON') or '')
                  cycle_stale = cycle_stale or 'STALE' in reason or side.get('HEDGE_BOOK_STATUS') == 'STALE' or side.get('LIMITLESS_BOOK_STATUS') == 'STALE'
                  cycle_incomplete = cycle_incomplete or 'INSUFFICIENT_HEDGE_DEPTH' in reason or side.get('HEDGE_DEPTH_SUFFICIENT') is False
                  edge = side.get('EXPECTED_NET_EDGE')
                  if isinstance(edge, (int, float)):
                      edge_samples.append(float(edge))
              stale += int(cycle_stale)
              incomplete += int(cycle_incomplete)

          exact_count = max(int(row.get('EXACT_EQUIVALENT_PAIR_COUNT', 0)) for row in rows)
          quoteable = sum(row.get('STRATEGY_QUOTEABLE') == 'YES' for row in rows)
          non_quoteable = sum(row.get('STRATEGY_QUOTEABLE') == 'NO' for row in rows)
          assert exact_count >= 1
          assert quoteable + non_quoteable == len(rows)

          summary = {
              'SOURCE_SHA': rows[0]['SOURCE_SHA'],
              'CYCLE_COUNT': len(rows),
              'RSS_MIN_KB': min(rss),
              'RSS_PEAK_KB': max(rss),
              'CPU_PROFILE': {'process_ms': cpu_ms, 'cpu_to_wall_ratio': cpu_ratio},
              'CYCLE_LATENCY_P50_MS': round(p50, 3),
              'CYCLE_LATENCY_P95_MS': round(p95, 3),
              'RECONNECTS': reconnects,
              'HTTP_ERRORS': 0,
              'STALE_REJECTIONS': stale,
              'INCOMPLETE_BOOK_REJECTIONS': incomplete,
              'EXACT_PAIR_COUNT': exact_count,
              'QUOTEABLE_CYCLES': quoteable,
              'NON_QUOTEABLE_CYCLES': non_quoteable,
              'NET_EDGE_SAMPLES': edge_samples,
              'EVIDENCE_BYTES_PER_CYCLE': [int(row.get('evidence_bytes_per_cycle', 0)) for row in rows],
              'DISCOVERY_CYCLE': 'PASS',
              'MARKET_DATA_CYCLE': 'PASS',
              'REAL_ORDERS': 0,
              'CAPITAL_MOVED_USD': 0,
              'LIVE': 'NO',
              'TARGET_80_STATUS': 'UNPROVEN',
              'PROFITABILITY_CLAIM': False,
          }
          Path('/tmp/sibyl-v6-runtime/profile-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, sort_keys=True))
          print('PROFILING=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibyl-v6-runtime-profile-${{ env.SOURCE_SHA }}
          path: /tmp/sibyl-v6-runtime
          if-no-files-found: error
          retention-days: 14
