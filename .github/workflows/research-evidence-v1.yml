name: Research Evidence V1

on:
  pull_request:
    paths:
      - "services/backend/app/evidence_v1.py"
      - "services/backend/app/polymarket.py"
      - "services/backend/app/scoring.py"
      - "services/backend/app/domain.py"
      - "services/backend/app/scanner.py"
      - "services/backend/tests/test_evidence_v1.py"
      - ".github/workflows/research-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Install backend development dependencies
        working-directory: services/backend
        run: pip install -e '.[dev]'
      - name: Run deterministic evidence suite
        working-directory: services/backend
        run: pytest tests/test_evidence_v1.py tests/test_scoring.py tests/test_domain.py -q
      - name: Real public external-feed smoke
        working-directory: services/backend
        run: |
          python - <<'PY'
          import httpx
          from app.evidence_v1 import BinancePublicFeed
          feed = BinancePublicFeed(httpx.Client(timeout=10))
          rows = feed.klines("BTCUSDT", 0, 1_000)
          assert isinstance(rows, list), type(rows)
          assert rows, "public Binance feed returned no BTCUSDT rows"
          print(f"BINANCE_PUBLIC_SMOKE=PASS rows={len(rows)}")
          PY
