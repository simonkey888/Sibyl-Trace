name: ORDER-002 One-shot exact-tree bridge

on:
  push:
    branches: [order-001-corrective-p0-p7]
    paths:
      - ".order-002-final.patch.gz.b64"

permissions:
  contents: write

jobs:
  apply-final-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STARTING_HEAD: c59ddd63d201465b4d3ec455e855a778f7a9d505
      EXPECTED_TREE: a01532e30e8ab43c707339e2723de46cc6208be5
      PAYLOAD_SHA256: 50b92231479e600a9e1c67f5141dbc7de6066700d36cfce62002d9a37774514a
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: order-001-corrective-p0-p7
          fetch-depth: 0

      - name: Apply audited final tree and self-remove bridge
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STARTING_HEAD" HEAD
          echo "$PAYLOAD_SHA256  .order-002-final.patch.gz.b64" | sha256sum -c -
          base64 -d .order-002-final.patch.gz.b64 | gzip -dc > /tmp/order-002-final.patch
          git apply --check --index /tmp/order-002-final.patch
          git apply --index /tmp/order-002-final.patch
          git rm .order-002-final.patch.gz.b64 .github/workflows/order-002-one-shot-bridge.yml
          actual_tree=$(git write-tree)
          echo "ACTUAL_TREE=$actual_tree"
          [[ "$actual_tree" == "$EXPECTED_TREE" ]]
          git config user.name "Simon Dalmasso"
          git config user.email "simondalmasso44@gmail.com"
          git commit -m "fix(order-002): close final audit contracts"
          git push origin HEAD:order-001-corrective-p0-p7
