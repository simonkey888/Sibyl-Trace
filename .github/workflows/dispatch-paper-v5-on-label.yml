name: One-shot PAPER V5 dispatch bridge

on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical PAPER V5 from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-paper-v5.yml --ref main -f reset_state=false

      - name: Remove trigger label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "${{ github.event.issue.number }}" --remove-label bug

      - name: Remove one-shot bridge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method DELETE \
            "/repos/$REPOSITORY/contents/.github/workflows/dispatch-paper-v5-on-label.yml" \
            -f message='chore: remove one-shot PAPER V5 dispatch bridge' \
            -f sha="$(gh api "/repos/$REPOSITORY/contents/.github/workflows/dispatch-paper-v5-on-label.yml?ref=main" --jq '.sha')" \
            -f branch=main
