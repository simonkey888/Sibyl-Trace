name: Retired Cloudflare Terminal V4 Publisher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: V4 publisher is permanently read-only
        run: |
          set -euo pipefail
          echo "RETIRED: Research V4 no longer owns the sibyl-trace Worker."
          echo "Canonical public publisher: publish-cloudflare-terminal-v5.yml"
          echo "Research V4 remains evidence input for the canonical V5 snapshot only."
          echo "No Cloudflare credentials are loaded and no wrangler deploy command exists here."
