name: Publish Cloudflare Terminal V4

on:
  workflow_run:
    workflows: ["Research Lab V4 Operational"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sibyl-cloudflare-terminal
  cancel-in-progress: false

jobs:
  publish-v4:
    name: publish validated V4 shadow plus latest V5 truth
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve source Research V4 run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/research-lab-v4-operational.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
            sha=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')
          fi
          [[ -n "$run_id" && -n "$sha" ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare configuration
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          enabled=true
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then enabled=false; fi
          done
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Check out exact canonical V4 source SHA
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Python
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json

      - name: Download and verify exact V4 evidence
        if: steps.cf.outputs.enabled == 'true'
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sibyl-v4-evidence
          gh run download "$SOURCE_RUN_ID" \
            --name "sibyl-research-v4-$SOURCE_RUN_ID" \
            --dir /tmp/sibyl-v4-evidence
          test -s /tmp/sibyl-v4-evidence/trial-summary.json
          test -s /tmp/sibyl-v4-evidence/research-v3-summary.json
          test -s /tmp/sibyl-v4-evidence/research-v4-summary.json
          test -s /tmp/sibyl-v4-evidence/SHA256SUMS
          (cd /tmp/sibyl-v4-evidence && sha256sum -c SHA256SUMS --ignore-missing)

      - name: Attach latest PASS V5 summary when available
        if: steps.cf.outputs.enabled == 'true'
        id: v5
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/github-paper-v5.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [[ -z "$run_id" ]]; then
            echo "included=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/sibyl-v5-evidence
          gh run download "$run_id" --name "sibyl-paper-v5-$run_id" --dir /tmp/sibyl-v5-evidence
          test -s /tmp/sibyl-v5-evidence/SHA256SUMS
          (cd /tmp/sibyl-v5-evidence && sha256sum -c SHA256SUMS --ignore-missing)
          test -s /tmp/sibyl-v5-evidence/paper-v5-summary.json
          grep -q '"midpoint_fills": false' /tmp/sibyl-v5-evidence/paper-v5-summary.json
          cp /tmp/sibyl-v5-evidence/paper-v5-summary.json /tmp/sibyl-v4-evidence/
          echo "included=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Build sanitized terminal snapshot
        if: steps.cf.outputs.enabled == 'true'
        env:
          PYTHONPATH: services/backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/dashboard/public/data
          python -m app.cloudflare_snapshot --input-dir /tmp/sibyl-v4-evidence --output-dir apps/dashboard/public/data
          test -s apps/dashboard/public/data/snapshot.json
          grep -q '"research_v4"' apps/dashboard/public/data/snapshot.json
          grep -q '"order_placement": false' apps/dashboard/public/data/snapshot.json
          if [[ "${{ steps.v5.outputs.included }}" == "true" ]]; then
            grep -q '"paper_v5"' apps/dashboard/public/data/snapshot.json
            grep -q '"midpoint_fills": false' apps/dashboard/public/data/snapshot.json
          fi
          ! grep -Eiq '"(api_key|apikey|access_token|refresh_token|private_key|seed_phrase|mnemonic|password|secret|bearer_token)"[[:space:]]*:' apps/dashboard/public/data/snapshot.json
          ! grep -Eiq -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|Bearer[[:space:]]+[A-Za-z0-9._-]{12,}' apps/dashboard/public/data/snapshot.json

      - name: Install pinned gateway dependencies
        if: steps.cf.outputs.enabled == 'true'
        working-directory: apps/gateway
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Deploy public read-only terminal
        if: steps.cf.outputs.enabled == 'true'
        working-directory: apps/gateway
        run: npx --no-install wrangler deploy

      - name: Publish summary
        if: steps.cf.outputs.enabled == 'true'
        shell: bash
        run: |
          {
            echo "### Sibyl Trace Cloudflare Terminal"
            echo "- Research V4 run: ${{ steps.source.outputs.run_id }}"
            echo "- Source SHA: ${{ steps.source.outputs.sha }}"
            echo "- Latest truthful V5 attached: ${{ steps.v5.outputs.included }}"
            echo "- V5 run: ${{ steps.v5.outputs.run_id || 'none' }}"
            echo "- Raw V4/V5 ledgers remain private artifacts"
            echo "- LIVE: absent"
          } >> "$GITHUB_STEP_SUMMARY"
