name: Temporary PAPER V5 dispatch trigger

on:
  push:
    branches: [main]
    paths:
      - ".ci-runtime-trigger"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired canonical PAPER V5
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-paper-v5.yml --ref main -f reset_state=false
