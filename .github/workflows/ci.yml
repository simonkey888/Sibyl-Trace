name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "order-001-**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: pip-audit --local --progress-spinner off
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json
      - run: node --check apps/dashboard/public/app.js
      - run: node --check apps/dashboard/public/ai-panel.js
      - working-directory: apps/gateway
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: apps/gateway
        run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/gateway
        run: npm run check
      - working-directory: apps/gateway
        run: npm test

  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan repository boundaries
        run: bash scripts/secret-scan.sh
      - name: Verify frozen PAPER V2 invariants
        run: python scripts/freeze_manifest.py --check
      - name: Exercise secret scanner fail-closed fixtures
        run: bash scripts/test-secret-scan.sh

  container:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate shell and Compose configuration
        run: |
          bash -n infra/oracle/bootstrap.sh scripts/activate-release.sh scripts/restore-backup.sh infra/backup/run.sh
          cp .env.example .env
          docker compose config -q
      - name: Build immutable custom images
        run: docker compose build api backup
      - name: Verify worker resolves the backend image
        run: |
          api_image=$(docker compose config --images | grep '^sibyl-trace-backend:' | head -1)
          worker_image=$(docker compose config | awk '/^  worker:/{found=1} found && /image:/{print $2; exit}')
          test -n "$api_image"
          test "$worker_image" = "$api_image"
      - name: Verify digest-pinned tunnel image
        run: docker compose pull tunnel

  research-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Deterministic research evidence suite
        run: >-
          pytest tests/test_evidence_v1.py tests/test_domain.py
          tests/test_scanner_quality_evidence.py -q
      - name: Public Binance read-only smoke
        run: |
          python - <<'PY'
          import time
          import httpx
          from app.evidence_v1 import BinancePublicFeed

          end_ms = int(time.time() * 1000)
          feed = BinancePublicFeed(httpx.Client(timeout=10))
          rows = feed.klines("BTCUSDT", end_ms - 5_000, end_ms)
          assert isinstance(rows, list), type(rows)
          assert rows, "public Binance market-data feed returned no recent rows"
          print(f"BINANCE_PUBLIC_SMOKE=PASS rows={len(rows)}")
          PY

  scoring-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Scoring and evidence integrity suite
        run: >-
          pytest tests/test_domain.py tests/test_scoring.py tests/test_evidence_v1.py
          tests/test_scanner_quality_evidence.py tests/test_source_strategy.py -q

  paper-v5-dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - dashboard
      - safety
      - container
      - research-evidence
      - scoring-integrity
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dispatch one canonical PAPER V5 transition for this exact green CI
        id: dispatch_paper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          run_url=$(gh workflow run github-paper-v5.yml --ref main)
          run_id="${run_url##*/}"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Wait for exact dispatched PAPER V5
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.dispatch_paper.outputs.run_id }}
        run: gh run watch "$SOURCE_RUN_ID" --interval 5 --exit-status
