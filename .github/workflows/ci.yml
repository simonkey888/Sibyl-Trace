name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check apps/dashboard/public/app.js
      - run: node --check apps/dashboard/public/ai-panel.js
      - working-directory: apps/gateway
        run: npm install --ignore-scripts
      - working-directory: apps/gateway
        run: npm run check
      - working-directory: apps/gateway
        run: npm test
  container:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate shell and Compose configuration
        run: |
          bash -n infra/oracle/bootstrap.sh scripts/activate-release.sh scripts/restore-backup.sh infra/backup/run.sh
          cp .env.example .env
          docker compose config -q
      - name: Build immutable custom images
        run: docker compose build api backup
      - name: Verify worker resolves the backend image
        run: |
          api_image=$(docker compose config --images | grep '^sibyl-trace-backend:' | head -1)
          worker_image=$(docker compose config | awk '/^  worker:/{found=1} found && /image:/{print $2; exit}')
          test -n "$api_image"
          test "$worker_image" = "$api_image"
      - name: Verify pinned tunnel image
        run: docker pull cloudflare/cloudflared:2026.7.3
