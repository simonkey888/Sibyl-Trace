name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: pip-audit --local --progress-spinner off
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json
      - run: node --check apps/dashboard/public/app.js
      - run: node --check apps/dashboard/public/ai-panel.js
      - working-directory: apps/gateway
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: apps/gateway
        run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/gateway
        run: npm run check
      - working-directory: apps/gateway
        run: npm test
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan repository boundaries
        run: bash scripts/secret-scan.sh
      - name: Verify frozen PAPER V2 invariants
        run: python scripts/freeze_manifest.py --check
  container:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate shell and Compose configuration
        run: |
          bash -n infra/oracle/bootstrap.sh scripts/activate-release.sh scripts/restore-backup.sh infra/backup/run.sh
          cp .env.example .env
          docker compose config -q
      - name: Build immutable custom images
        run: docker compose build api backup
      - name: Verify worker resolves the backend image
        run: |
          api_image=$(docker compose config --images | grep '^sibyl-trace-backend:' | head -1)
          worker_image=$(docker compose config | awk '/^  worker:/{found=1} found && /image:/{print $2; exit}')
          test -n "$api_image"
          test "$worker_image" = "$api_image"
      - name: Verify digest-pinned tunnel image
        run: docker compose pull tunnel
  paper-v5-dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dispatch canonical PAPER V5 clean cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-paper-v5.yml --ref main -f reset_state=true
      - name: Resolve and wait for current-main PAPER V5
        id: paper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"
          for _ in {1..30}; do
            run_id=$(gh run list --workflow github-paper-v5.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,status --jq --arg sha "$target_sha" '.[] | select(.headSha == $sha) | .databaseId' | head -1)
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              gh run watch "$run_id" --interval 5 --exit-status
              exit 0
            fi
            sleep 3
          done
          echo "Unable to resolve a PAPER V5 run for current main SHA $target_sha" >&2
          exit 1
      - name: Dispatch verified public V5 publisher
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.paper.outputs.run_id }}
        run: gh workflow run publish-cloudflare-terminal-v5.yml --ref main -f source_run_id="$SOURCE_RUN_ID"
