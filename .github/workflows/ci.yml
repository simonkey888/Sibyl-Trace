name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: pip-audit --local --progress-spinner off
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gateway/package-lock.json
      - run: node --check apps/dashboard/public/app.js
      - run: node --check apps/dashboard/public/ai-panel.js
      - working-directory: apps/gateway
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: apps/gateway
        run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/gateway
        run: npm run check
      - working-directory: apps/gateway
        run: npm test
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan repository boundaries
        run: bash scripts/secret-scan.sh
      - name: Verify frozen PAPER V2 invariants
        run: python scripts/freeze_manifest.py --check
  container:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate shell and Compose configuration
        run: |
          bash -n infra/oracle/bootstrap.sh scripts/activate-release.sh scripts/restore-backup.sh infra/backup/run.sh
          cp .env.example .env
          docker compose config -q
      - name: Build immutable custom images
        run: docker compose build api backup
      - name: Verify worker resolves the backend image
        run: |
          api_image=$(docker compose config --images | grep '^sibyl-trace-backend:' | head -1)
          worker_image=$(docker compose config | awk '/^  worker:/{found=1} found && /image:/{print $2; exit}')
          test -n "$api_image"
          test "$worker_image" = "$api_image"
      - name: Verify digest-pinned tunnel image
        run: docker compose pull tunnel
  paper-v5-dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Patch canonical V5 release checksum asset name
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/github-paper-v5.yml')
          s = p.read_text(encoding='utf-8')
          old = '''          gh release delete-asset "$RELEASE_TAG" prediction-ledger-v5.jsonl --yes >/dev/null 2>&1 || true
          gh release upload "$RELEASE_TAG" \\
            sibyl-v5.db.gz \\
            paper-v5-summary.json \\
            paper-v5-summary.md \\
            evidence-manifest-v5.json \\
            copy-timing-analysis.json \\
            RELEASE_SHA256SUMS#SHA256SUMS \\
            --clobber
          '''
          new = '''          gh release delete-asset "$RELEASE_TAG" prediction-ledger-v5.jsonl --yes >/dev/null 2>&1 || true
          gh release delete-asset "$RELEASE_TAG" RELEASE_SHA256SUMS --yes >/dev/null 2>&1 || true
          mv RELEASE_SHA256SUMS SHA256SUMS
          gh release upload "$RELEASE_TAG" \\
            sibyl-v5.db.gz \\
            paper-v5-summary.json \\
            paper-v5-summary.md \\
            evidence-manifest-v5.json \\
            copy-timing-analysis.json \\
            SHA256SUMS \\
            --clobber
          '''
          if old not in s:
              raise SystemExit('canonical release upload block not found; refusing to patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'mv RELEASE_SHA256SUMS SHA256SUMS' .github/workflows/github-paper-v5.yml
          ! grep -q 'RELEASE_SHA256SUMS#SHA256SUMS' .github/workflows/github-paper-v5.yml
      - name: Commit canonical V5 workflow repair without recursive push trigger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/github-paper-v5.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: publish V5 checksum asset under canonical filename'
          git push origin HEAD:main
      - name: Dispatch repaired canonical PAPER V5 with clean cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-paper-v5.yml --ref main -f reset_state=true
