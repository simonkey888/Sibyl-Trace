name: Audit Reconciliation Patch Once
on:
  push:
    branches: [fix/paper-v5-audit-reconciliation-001]
    paths: [".github/workflows/audit-reconciliation-patch-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/paper-v5-audit-reconciliation-001
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/audit_reconciliation_patch.py
      - name: Format and focused verify
        run: |
          python -m pip install -q ruff==0.12.3
          ruff format services/backend/app/models_v5.py services/backend/app/polymarket.py services/backend/app/paper_v5_r4.py services/backend/app/cloudflare_snapshot.py services/backend/tests/test_paper_v5_r4.py services/backend/tests/test_cloudflare_snapshot_v5.py
          ruff check --fix services/backend/app/models_v5.py services/backend/app/polymarket.py services/backend/app/paper_v5_r4.py services/backend/app/cloudflare_snapshot.py services/backend/tests/test_paper_v5_r4.py services/backend/tests/test_cloudflare_snapshot_v5.py
          cd services/backend
          pip install -q -e '.[dev]'
          pytest -q tests/test_paper_v5_r4.py tests/test_cloudflare_snapshot_v5.py tests/test_execution_v5.py
      - name: Commit source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/backend
          git diff --cached --check
          git commit -m 'fix(v5): reconcile latency market state and evidence truth'
          git push origin HEAD:fix/paper-v5-audit-reconciliation-001
