name: Temporary Audit Verification

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: temporary-audit-verification
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 01469245d59fcd52369aab8692f16967f5230bf8

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pip check
      - run: pip-audit --local --progress-spinner off
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --check apps/dashboard/public/app.js
      - run: node --check apps/dashboard/public/ai-panel.js
      - working-directory: apps/gateway
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: apps/gateway
        run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/gateway
        run: npm run check
      - working-directory: apps/gateway
        run: npm test

  container:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ env.CANDIDATE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Validate shell and Compose configuration
        run: |
          bash -n infra/oracle/bootstrap.sh scripts/activate-release.sh scripts/restore-backup.sh infra/backup/run.sh
          cp .env.example .env
          docker compose config -q
      - name: Build immutable custom images
        run: docker compose build api backup
      - name: Verify worker resolves the backend image
        run: |
          api_image=$(docker compose config --images | grep '^sibyl-trace-backend:' | head -1)
          worker_image=$(docker compose config | awk '/^  worker:/{found=1} found && /image:/{print $2; exit}')
          test -n "$api_image"
          test "$worker_image" = "$api_image"
      - name: Verify digest-pinned tunnel image
        run: docker compose pull tunnel
