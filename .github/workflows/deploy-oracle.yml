name: Deploy Oracle
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: sibyl-oracle-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.ORACLE_HOST_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Build immutable release archive
        run: |
          tar --exclude-vcs --exclude='./apps' -czf /tmp/sibyl-release.tgz .
          sha256sum /tmp/sibyl-release.tgz > /tmp/sibyl-release.tgz.sha256
      - name: Upload, verify, and activate release
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          scp /tmp/sibyl-release.tgz /tmp/sibyl-release.tgz.sha256 \
            "$USER@$HOST:/tmp/"
          ssh "$USER@$HOST" "RELEASE_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          BASE=/opt/sibyl-trace
          RELEASE="$BASE/releases/$RELEASE_SHA"
          cd /tmp
          sha256sum -c sibyl-release.tgz.sha256
          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"
          tar -xzf sibyl-release.tgz -C "$RELEASE"
          rm -f sibyl-release.tgz sibyl-release.tgz.sha256
          bash "$RELEASE/scripts/activate-release.sh" "$BASE" "$RELEASE_SHA"
          REMOTE
