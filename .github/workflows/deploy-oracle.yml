name: Deploy Oracle
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: sibyl-oracle-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.ORACLE_HOST_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload immutable bundle
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          tar --exclude-vcs --exclude='apps' -czf /tmp/sibyl-release.tgz .
          scp /tmp/sibyl-release.tgz "$USER@$HOST:/tmp/sibyl-${GITHUB_SHA}.tgz"
          ssh "$USER@$HOST" "set -e; cd /opt/sibyl-trace; tar -xzf /tmp/sibyl-${GITHUB_SHA}.tgz; rm /tmp/sibyl-${GITHUB_SHA}.tgz; APP_VERSION=${GITHUB_SHA} docker compose up -d --build --remove-orphans; docker compose ps"
