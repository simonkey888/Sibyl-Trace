name: V5 Public CLOB Probe Once

on:
  push:
    branches: [fix/paper-v5-r2-clob-contract]
    paths: [".github/workflows/v5-public-probe-once.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public market info fee and book shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          from urllib.error import HTTPError

          samples = [
              ("0xc5b21abf616dc34cb12af4b999533e13fa074769179c91c271aa26e7a73ec547", "87546368140639568899839155450072692652731563666513865404114732265401185801954"),
              ("0xb0c1520b73ab7914ff7c6911d9dae3fb23c43e9e135d66e5a5c60c81fc7e0be3", "104962777829004421188730458567415189754374178274306449105271152889322315270092"),
              ("0x3afdfcb1f5499054e5d64f2ac0f31b91ab3f04d1f4fa81ec7d99d5ce8224666b", "25073976762473455089894173590067036290567812110473517357630019578976256519527"),
          ]

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "sibyl-trace/probe-2026-08-07",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(response.read().decode())
              except HTTPError as exc:
                  body = exc.read().decode(errors="replace")[:500]
                  return exc.code, {"http_error": body}

          for condition, token in samples:
              print("SAMPLE", condition, token)
              status, info = get(f"https://clob.polymarket.com/clob-markets/{condition}")
              print("INFO_STATUS", status)
              if isinstance(info, dict):
                  print("INFO_KEYS", sorted(info.keys()))
                  print("INFO_RULES", json.dumps({key: info.get(key) for key in ("mos", "mts", "itode", "fd", "tbf", "mbf", "gst", "oas")}, sort_keys=True))
              status, fee = get(f"https://clob.polymarket.com/fee-rate/{token}")
              print("FEE_STATUS", status, "FEE", json.dumps(fee, sort_keys=True))
              status, book = get(f"https://clob.polymarket.com/book?token_id={token}")
              print("BOOK_STATUS", status)
              if isinstance(book, dict):
                  print("BOOK_META", json.dumps({key: book.get(key) for key in ("asset_id", "market", "timestamp", "hash", "min_order_size", "tick_size", "last_trade_price")}, sort_keys=True))
                  print("BOOK_DEPTH", len(book.get("bids") or []), len(book.get("asks") or []))
          PY
