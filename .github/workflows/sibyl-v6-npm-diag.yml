name: Sibyl V6 NPM Provenance Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/sibyl-v6-npm-diag.yml"
  push:
    branches:
      - feat/sibyl-v6-cross-market-mm-r1
    paths:
      - ".github/workflows/sibyl-v6-npm-diag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Resolve exact registry metadata
        run: |
          set -euo pipefail
          echo "OX_VERSION=0.14.26"
          npm view ox@0.14.26 version dist.tarball dist.integrity gitHead --json
