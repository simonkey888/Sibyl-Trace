name: Retired Generic Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Generic deploy path is disabled
        run: |
          set -euo pipefail
          echo "RETIRED: generic Cloudflare deployment is disabled for sibyl-trace."
          echo "Only publish-cloudflare-terminal-v5.yml may write the public Worker."
          echo "This workflow intentionally loads no production secrets and performs no deploy."
