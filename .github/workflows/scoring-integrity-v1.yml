name: Scoring Evidence Integrity V1

on:
  push:
    branches: [main]
    paths:
      - "services/backend/app/domain.py"
      - "services/backend/tests/test_domain.py"
      - ".github/workflows/scoring-integrity-v1.yml"
  pull_request:
    paths:
      - "services/backend/app/domain.py"
      - "services/backend/tests/test_domain.py"
      - ".github/workflows/scoring-integrity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-integrity:
    name: Evidence Integrity Gate V1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install backend development dependencies
        working-directory: services/backend
        run: pip install -e '.[dev]'

      - name: Run scoring integrity tests
        working-directory: services/backend
        run: pytest tests/test_domain.py -q
